# 持续任务引擎 — 默认配置模板
# 按需修改后通过 --config 传入；未指定时使用本文件默认值

project:
  name: "持续SEO优化项目"
  description: "通过持续的内容建设和技术优化提升搜索引擎排名"

# cycle.* 在引擎启动时与内置默认值合并（见 SKILL.md）
cycle:
  interval_days: 7          # 循环阶段默认间隔（天）
  max_empty_before_backoff: 10  # 连续空轮次后启用退避
  backoff_factor: 2         # 退避倍数
  max_sleep_sec: 86400      # 单次调度最大休眠（秒）

checks:
  - id: "seo_audit"
    type: shell_cmd
    params:
      cmd: "echo '模拟 SEO 审计完成'"
      timeout_sec: 30

rules:
  - match:
      source: "seo_audit"
      is_new: true
    actions:
      - type: dispatch
        target: seo
        description: "处理 SEO 审计发现"