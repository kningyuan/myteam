id: data-summary
version: "1.0"
name: 数据分析与总结
description: 分析数据、生成图表、撰写总结，三步流程

metadata:
  source_sop: "分析数据 → 生成图表 → 写总结"
  created_at: "2026-06-25"
  domain: "数据分析"

inputs:
  - name: data_source
    type: string
    description: "数据来源或数据文件路径"
    required: true

steps:
  - id: step-analyze
    name: 分析数据
    description: |
      【范围】对指定数据进行分析，识别关键趋势和模式
      【输入】数据来源
      【交付】数据分析结果（Markdown）
      【质量】覆盖分析口径、数据来源、关键发现
    agent: research
    task_type: data-analysis
    inputs:
      - data_source
    outputs:
      - name: analysis_result
        type: file
        format: markdown
        description: "数据分析结果"
    quality_gate:
      type: check_sections
      required_sections:
        - 分析问题与口径
        - 数据来源与质量
        - 分析过程与方法
        - 关键发现
        - 结论与行动建议
      min_length: 500

  - id: step-chart
    name: 生成图表
    description: |
      【范围】基于数据分析结果，生成可视化图表
      【输入】数据分析结果
      【交付】图表说明（Markdown，含图表描述和解读）
      【质量】图表须覆盖核心数据发现，附解读说明
    agent: product
    task_type: custom-survey
    inputs:
      - analysis_result
    outputs:
      - name: chart_report
        type: file
        format: markdown
        description: "图表说明与解读"
    quality_gate:
      type: check_sections
      required_sections:
        - 背景
        - 结论
      min_length: 300

  - id: step-summary
    name: 写总结
    description: |
      【范围】整合数据分析结果和图表，撰写完整总结报告
      【输入】数据分析结果、图表说明
      【交付】总结报告（Markdown）
      【质量】报告须包含背景、核心发现、结论与建议
    agent: product
    task_type: review
    inputs:
      - analysis_result
      - chart_report
    outputs:
      - name: final_summary
        type: file
        format: markdown
        description: "总结报告"
    quality_gate:
      type: check_sections
      required_sections:
        - 评审范围
        - 问题列表
        - 改进建议
      min_length: 500

outputs:
  - name: data_summary_report
    type: file
    format: markdown
    description: "数据分析与总结报告"