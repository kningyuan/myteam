id: competitive-analysis
version: "1.0"
name: 竞品分析
description: 每周对 Cursor、GitHub Copilot、Augment Code 进行竞品分析，产出包含竞品概览、对比矩阵、优劣势分析与差异化建议的 Markdown 报告

metadata:
  source_sop: "研究员收集竞品信息 → 产品专家做对比分析建立矩阵 → 产品专家写最终报告（竞品概览、对比矩阵、优劣势分析、差异化建议）"
  created_at: "2026-06-25"
  domain: "产品分析"

inputs:
  - name: competitors
    type: array
    description: "竞品列表，固定为 Cursor、GitHub Copilot、Augment Code"
    required: true
  - name: info_sources
    type: array
    description: "信息来源：官网、公开文档、应用商店"
    required: true
  - name: comparison_dimensions
    type: array
    description: "对比维度：功能、定价"
    required: true

steps:
  - id: step-collect
    name: 收集竞品信息
    description: |
      【范围】从官网、公开文档、应用商店收集 Cursor、GitHub Copilot、Augment Code 的功能、定价、用户评价信息。信息不完整时标注缺失，不跳过。
      【输入】竞品列表、信息来源
      【交付】竞品信息原始数据（Markdown）
      【质量】每个竞品至少覆盖功能、定价、用户评价三个维度；缺失信息明确标注
    agent: research
    task_type: research
    inputs:
      - competitors
      - info_sources
    outputs:
      - name: competitor_raw_data
        type: file
        format: markdown
        description: "竞品原始信息汇总，含功能、定价、用户评价"
    quality_gate:
      type: check_sections
      required_sections:
        - Cursor 功能
        - Cursor 定价
        - Cursor 用户评价
        - GitHub Copilot 功能
        - GitHub Copilot 定价
        - GitHub Copilot 用户评价
        - Augment Code 功能
        - Augment Code 定价
        - Augment Code 用户评价
      min_length: 800

  - id: step-compare
    name: 对比分析
    description: |
      【范围】基于收集的原始数据，从功能、定价两个维度建立对比矩阵，分析各竞品优劣势。
      【输入】竞品信息原始数据
      【交付】对比矩阵（Markdown 表格）
      【质量】矩阵须覆盖功能、定价两个维度；每项结论须有数据支撑
    agent: product
    task_type: competitive-analysis
    inputs:
      - competitor_raw_data
    outputs:
      - name: comparison_matrix
        type: file
        format: markdown
        description: "功能与定价对比矩阵"
    quality_gate:
      type: check_sections
      required_sections:
        - 功能对比矩阵
        - 定价对比矩阵
        - 优劣势分析
      min_length: 600

  - id: step-report
    name: 撰写最终报告
    description: |
      【范围】整合竞品原始数据与对比矩阵，撰写完整的竞品分析报告。
      【输入】竞品信息原始数据、对比矩阵
      【交付】竞品分析报告（Markdown），包含竞品概览、对比矩阵、优劣势分析、差异化建议
      【质量】报告须包含竞品概览、对比矩阵、优劣势分析、差异化建议四个章节
    agent: product
    task_type: competitive-analysis
    inputs:
      - competitor_raw_data
      - comparison_matrix
    outputs:
      - name: final_report
        type: file
        format: markdown
        description: "完整竞品分析报告"
    quality_gate:
      type: check_sections
      required_sections:
        - 竞品概览
        - 对比矩阵
        - 优劣势分析
        - 差异化建议
      min_length: 1500

outputs:
  - name: competitive_analysis_report
    type: file
    format: markdown
    description: "竞品分析报告（竞品概览、对比矩阵、优劣势分析、差异化建议）"