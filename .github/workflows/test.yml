name: myteam CI

on:
  push:
    branches: [main, fix/*, upgrade/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt 2>/dev/null || true
          venv/bin/pip install fastapi uvicorn httpx pytest
      - name: Run tests
        run: |
          export MYTEAM_ROOT="$PWD"
          export PYTHONPATH="$PWD/backend"
          venv/bin/python3 -m pytest backend -q --tb=short