name: reg-05-budget
description: "REG-05：budget 护栏 — token 计量打通 + 极小 budget 触发中断（需真实 CLI）"
mode: run_kernel  # 需要 claude/opencode CLI
goal: "分析以下10个话题各写50字：AI伦理、量子计算、气候变化、区块链、生物技术、元宇宙、空间技术、自动驾驶、数字经济、网络安全"
budget: 500        # 极小值，预期触发 budget 超限中断
backend: claude
max_cycles: 1

thresholds:
  k5_min: 1.0     # token 计量准确率 = 100%
  expected_status: budget_exceeded   # 或被中断

notes: |
  REG-05 需要有效的 ANTHROPIC_API_KEY 或 opencode 配置。
  无 CLI 环境时标记为"本地验收待补"，不阻断 Sprint 完工。
