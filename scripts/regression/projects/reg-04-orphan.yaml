name: reg-04-orphan
description: "REG-04：孤儿回收 E2E — timed_out interaction + .response 孤儿回收验证"
mode: scripted   # 非 run_kernel，直接调用 reconcile_on_start + proc.resume
script: scripts/regression/reg_04_orphan.py

thresholds:
  k4_min: 0.95   # 孤儿回收率 ≥ 95%

cases:
  positive:
    description: "timed_out + 合法 .response → 采纳，task = needs_review/completed"
    expected: pass
  negative:
    description: "timed_out + 不合规 .response（interaction_id 不匹配）→ 保持 failed"
    expected: pass
