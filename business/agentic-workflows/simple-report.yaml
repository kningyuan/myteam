id: simple-report
version: "1.0"
name: 信息收集与报告撰写
description: 收集信息后撰写报告，两步简单流程

metadata:
  source_sop: "收集信息 → 撰写报告"
  created_at: "2026-06-25"
  domain: "通用"

inputs:
  - name: topic
    type: string
    description: "收集信息的主题"
    required: true

steps:
  - id: step-collect
    name: 收集信息
    description: |
      【范围】围绕指定主题收集信息，整理关键发现
      【输入】主题
      【交付】信息收集结果（Markdown）
      【质量】覆盖关键信息点，标注来源
    agent: research
    task_type: research
    inputs:
      - topic
    outputs:
      - name: collected_info
        type: file
        format: markdown
        description: "收集的信息汇总"
    quality_gate:
      type: check_sections
      required_sections:
        - 调研目标
        - 信息来源
        - 关键发现
        - 结论
      min_length: 500

  - id: step-report
    name: 撰写报告
    description: |
      【范围】基于收集的信息撰写完整报告
      【输入】信息收集结果
      【交付】报告（Markdown）
      【质量】报告结构完整，逻辑清晰
    agent: product
    task_type: review
    inputs:
      - collected_info
    outputs:
      - name: final_report
        type: file
        format: markdown
        description: "最终报告"
    quality_gate:
      type: check_sections
      required_sections:
        - 评审范围
        - 问题列表
        - 改进建议
      min_length: 800

outputs:
  - name: report
    type: file
    format: markdown
    description: "信息收集与报告撰写结果"