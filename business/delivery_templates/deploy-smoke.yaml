id: deploy-smoke
version: '1.0'
display_name: 部署冒烟验证
description: 部署后冒烟验证记录模板（证据态）
task_types:
  - deploy-run
deliverable_template:
  required_heading_level: 2
  sections:
    - name: 部署环境
      description: 填写部署环境
      required: true
    - name: 服务URL
      description: 可访问的服务根 URL
      required: true
    - name: 健康检查
      description: 探活结果与 HTTP 状态
      required: true
    - name: 证据截图
      description: 截图相对路径
      required: true
check_rules:
  required_sections:
    - 部署环境
    - 服务URL
    - 健康检查
    - 证据截图
  evidence_url:
    screenshot_field: 证据截图
    verify_title: false
  min_length: 30
