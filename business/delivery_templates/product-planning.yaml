id: product-planning
version: '1.0'
display_name: 产品规划
description: 产品规划交付模板
task_types:
  - product-planning
deliverable_template:
  required_heading_level: 2
  sections:
    - name: 产品定位
      description: 填写「产品定位」章节，明确产品核心价值和目标用户
      required: true
    - name: 核心功能
      description: 填写「核心功能」章节，列出 3-5 个核心功能
      required: true
    - name: 优先级排序
      description: 填写「优先级排序」章节，基于价值/成本矩阵排序
      required: true
    - name: 实施路线图
      description: 填写「实施路线图」章节，分阶段规划
      required: true
check_rules:
  required_sections:
    - 产品定位
    - 核心功能
    - 优先级排序
    - 实施路线图
  min_length: 300