id: code-audit
version: "1.0"
display_name: 代码健康检查报告
description: 代码审计的交付模板，包含检测结果、评分、趋势和改进建议

task_types:
  - code-audit

deliverable_template:
  required_heading_level: 2
  sections:
    - name: 执行摘要
      required: true
      prompt: 检测范围、目标项目、使用的工具链列表
    - name: 检测结果
      required: true
      prompt: 每项工具的运行结果：类型检查/lint/测试/死代码/shell 检查，含通过/失败/跳过状态
    - name: 评分与趋势
      required: true
      prompt: 各维度评分（0-10）、综合得分、与上次对比的趋势
    - name: 改进建议
      required: true
      prompt: 按优先级排列的改进建议，每项含影响评估和修复命令

check_rules:
  required_sections:
    - 执行摘要
    - 检测结果
    - 评分与趋势
    - 改进建议
  min_length: 100
  stub_floor: 50

acceptance_criteria:
  - 检测结果覆盖至少类型检查 + lint + 测试三项
  - 评分包含各维度分数和综合得分
  - 改进建议按优先级排列
  - 末行包含评审结论标记