id: research-report
version: '1.0'
display_name: research-report
description: ''
task_types:
- research
default_for: research
deliverable_template:
  title: 竞品调研报告
  sections:
  - name: 调研背景
    description: 调研目的、范围、竞品对象
    required: true
  - name: 信息来源
    description: 每个关键信息的来源标注（URL/出处）
    required: true
  - name: 关键发现
    description: 至少3条，含对比/优势/劣势
    required: true
  - name: 结论
    description: 可执行建议（P0/P1/优先级/下一步）+ 异常场景应对
    required: true
  required_heading_level: 2
check_rules:
  required_sections:
  - 调研背景
  - 信息来源
  - 关键发现
  - 结论
  stub_floor: 200
  require_comparison_matrix: true
  dimension_coverage:
  - 核心功能
  - 用户画像
  - 变现模式
  - 用户评价
  source_inline_required: true
  no_unsourced_in_findings: true
acceptance_criteria:
- 完整覆盖调研背景章节且内容具体
- 信息来源必须标注（URL/出处），禁止编造数据
- 关键发现至少3条，含对比/优势/劣势
- 结论含可执行建议（P0/P1/优先级/下一步）
- 覆盖异常/边界场景，不能只写正常情况
