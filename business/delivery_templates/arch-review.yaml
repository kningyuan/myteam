id: arch-review
version: "1.0"
display_name: 架构评审报告
description: 架构评审的交付模板，包含概述、分析、风险和建议四个章节

# 关联的 task_type（可选，用于 UI 关联）
task_types:
  - architecture-review

# 交付物结构
deliverable_template:
  required_heading_level: 2
  sections:
    - name: 概述
      required: true
      prompt: 评审目标、范围、被评审的系统/设计方案概述
    - name: 架构分析
      required: true
      prompt: 关键设计决策的详细分析，包括架构选型理由、权衡取舍
    - name: 技术风险
      required: true
      prompt: 识别到的技术风险，按高/中/低分级，说明影响范围和可能性
    - name: 改进建议
      required: true
      prompt: 具体可执行的改进建议，每项建议与风险一一对应

# 校验规则（覆盖/补充 task_type 的 check_rules）
check_rules:
  required_sections:
    - 概述
    - 架构分析
    - 技术风险
    - 改进建议
  min_length: 200
  stub_floor: 100
  must_include:
    - 技术风险识别
    - 改进建议

# 验收标准（覆盖/补充 task_type 的 acceptance_criteria）
acceptance_criteria:
  - 概述清晰说明评审目标和范围
  - 架构分析覆盖关键设计决策及其理由
  - 技术风险按严重程度分级（高/中/低）
  - 改进建议具体可执行，与风险一一对应
  - 末行包含评审结论标记
