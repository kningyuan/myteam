id: tds-ch3-product-planning
version: '1.0'
display_name: 第三章产品整体规划
description: 第三章产品整体规划交付模板（含架构图文件约束）
task_types:
  - product-planning
deliverable_template:
  required_heading_level: 3
  sections:
    - name: 背景与目标
      required: true
    - name: 产品架构
      required: true
    - name: 核心能力
      required: true
    - name: 优势分析
      required: true
    - name: 功能架构
      required: true
    - name: 第一期 MVP版本
      required: true
    - name: 研发规划
      required: true
check_rules:
  required_sections:
    - 背景与目标
    - 产品架构
    - 核心能力
    - 优势分析
    - 功能架构
    - 第一期 MVP版本
    - 研发规划
  file_exists:
    - product-architecture.drawio
    - functional-architecture.png
  must_include:
    - product-architecture.png
  min_length: 300
