id: tds-ch3-product-planning
task_types:
  - product-planning
default_for: product-planning
version: "1.1"
display_name: 可信数据空间 · 第三章产品整体规划
description: |
  《副本可信数据空间.docx》第三章「产品整体规划」完整目录（含全部小标题）。
  章标题用 ##，各小节用 ###；Gate 按 ### 校验。
  「产品架构」「功能架构」须交付 draw.io 源文件 + PNG（Gate file_exists）。

deliverable_template:
  required_heading_level: 3
  sections:
    - name: 产品架构
      description: |
        四大组件分层与关系；须含 product-architecture.drawio + product-architecture.png，
        Markdown 内嵌预览图与图注（禁止仅占位符）
      required: true
    - name: 核心能力
      description: 核心能力总述
      required: true
    - name: 数据管控能力
      required: true
    - name: 资源交互能力与产品探查开发
      required: true
    - name: 隐私保护
      required: true
    - name: 设计原则
      required: true
    - name: 控制平面与业务平面分离
      required: true
    - name: 连接器双模式
      description: 唯一数据出入口与控制器模式
      required: true
    - name: 连接器模块化集成
      description: 合约引擎、隐私计算、沙箱；API/插件集成
      required: true
    - name: 安全等级与管理要求适配
      required: true
    - name: 运行模式
      required: true
    - name: 数据流模式
      description: 统一走连接器 / 单独走数据平面（交付通道）
      required: true
    - name: 业务流模式
      description: 从连接器或运营平台发起
      required: true
    - name: 优势分析
      description: 相对竞品差异化；原稿「不写」须补齐
      required: true
    - name: 功能架构
      description: |
        四大组件功能域划分；须含 functional-architecture.drawio + functional-architecture.png，
        Markdown 内嵌预览图与图注（禁止仅占位符）
      required: true
    - name: 核心流程
      description: 接入→开发→交付→监测主流程
      required: true
    - name: 产品形态
      required: true
    - name: 使用方式
      required: true
    - name: 中心化与去中心化
      required: true
    - name: 研发规划
      required: true
    - name: 第一期 MVP版本
      description: 工期、运营平台+连接器、演示能力
      required: true
    - name: 第二期 合规监测与安全防护版本
      required: true
    - name: 第三期 数据产品安全开发平台
      required: true
  structure:
    - "# 第三章 产品整体规划"
    - 各小节 ### 标题与 docx 一致
    - "### 产品架构 / ### 功能架构 各须嵌入 PNG 并同目录交付 .drawio"

check_rules:
  required_sections:
    - 产品架构
    - 核心能力
    - 数据管控能力
    - 资源交互能力与产品探查开发
    - 隐私保护
    - 设计原则
    - 控制平面与业务平面分离
    - 连接器双模式
    - 连接器模块化集成
    - 安全等级与管理要求适配
    - 运行模式
    - 数据流模式
    - 业务流模式
    - 优势分析
    - 功能架构
    - 核心流程
    - 产品形态
    - 使用方式
    - 中心化与去中心化
    - 研发规划
    - 第一期 MVP版本
    - 第二期 合规监测与安全防护版本
    - 第三期 数据产品安全开发平台
  file_exists:
    - product-architecture.drawio
    - product-architecture.png
    - functional-architecture.drawio
    - functional-architecture.png
  min_length: 3500
  must_include:
    - 优势分析
    - product-architecture.png
    - functional-architecture.png

acceptance_criteria:
  - 【质量】逐节论证是否合理、与第一/二章一致；评审不得以字数替代实质判断（min_length 仅为 work Gate 下限）
  - 全部 ### 小标题齐全，与 Word 第三章目录一致
  - 产品架构、功能架构各含 draw.io 源文件、PNG 预览及 Markdown 内嵌图
  - 优势分析不得留空；须有四厂商差异化对比，非套话
  - 功能架构须有文字模块说明 + 架构图，且与产品架构逻辑一致
  - 研发规划含三期范围与工期，与 source_ch3_current 一致
  - 与第一、二章材料术语一致
