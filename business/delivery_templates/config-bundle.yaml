id: config-bundle
version: '1.0'
display_name: 配置包交付
description: 配置包交付模板（工程态，约束配置文件扩展名）
task_types:
  - config-bundle
deliverable_template:
  required_heading_level: 2
  sections:
    - name: 包说明
      description: 配置用途与变更摘要
      required: true
    - name: 文件清单
      description: 目录内文件说明
      required: true
check_rules:
  required_sections:
    - 包说明
    - 文件清单
  required_extensions:
    - .yaml
    - .yml
    - .json
  file_exists:
    - README.md
  min_project_files: 2
  min_length: 100
