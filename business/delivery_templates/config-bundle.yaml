id: config-bundle
task_types:
  - config-bundle
default_for: config-bundle
version: "1.0"
display_name: 配置包（包态示例）
description: |
  非源码类包态交付：Helm/K8s yaml、应用 config.json 等。
  证明「包态」不限于 code-writing。

deliverable_template:
  required_heading_level: 2
  sections:
    - name: 包说明
      description: 配置用途、环境、变更摘要
      required: true
    - name: 文件清单
      description: 列出目录内各文件及作用
      required: true
  structure:
    - 根目录 deliverables/<task_id>/
    - 至少一个 .yaml/.yml/.json 配置文件

check_rules:
  min_project_files: 2
  required_extensions:
    - .yaml
    - .yml
    - .json
  file_exists:
    - README.md
  required_sections:
    - 包说明
    - 文件清单
  min_length: 100

acceptance_criteria:
  - 配置语法可解析（yaml/json load 无报错）
  - README 说明如何 apply/挂载
