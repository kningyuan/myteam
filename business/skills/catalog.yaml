# Skill / Means 目录 — Agent 按 task_type 自选（workflow 不得写死路径）
# router 路径：business/skills/<skill_id>/SKILL.md（扁平目录；分类见 categories.yaml）
version: "0.2"

skills:
  - id: arch-research
    task_types: [arch-research]
    description: 架构向桌面调研
    router: business/skills/system-architecture-methodology/SKILL.md
    means: []

  - id: product-research
    task_types: [product-research]
    description: 产品向桌面调研
    router: business/skills/product-methodology/SKILL.md
    means: []

  - id: product-planning
    task_types: [product-planning]
    description: 产品说明·整体规划章节
    router: business/skills/product-methodology/SKILL.md
    means: []

  - id: section-authoring
    task_types: [section-authoring]
    description: 方案/文档指定章节撰写
    router: business/skills/product-methodology/SKILL.md
    means: []

  - id: section-review
    task_types: [section-review]
    description: 方案章节审计与放行判定
    router: business/skills/quality-review/SKILL.md
    means: []

  - id: diagram-build
    task_types: [diagram-build]
    description: 架构/流程图 — brief → draw.io → PNG
    router: business/skills/diagram-build/SKILL.md
    means_root: business/means/diagram-build
    execution: business/means/diagram-build/EXECUTION.md
    probe: business/means/diagram-build/scripts/probe.sh
    verify: business/means/diagram-build/scripts/verify_diagram.py
    means:
      - id: brief_to_drawio
        script: business/means/diagram-build/scripts/brief_to_drawio.py
      - id: handwrite_drawio
        ref: business/means/diagram-build/references/drawing_spec.md
      - id: render_png
        script: business/means/diagram-build/scripts/build_diagram.sh
    deliverables: [diagram.drawio, diagram.png]

  - id: deck-build
    task_types: [deck-build]
    description: 演示文稿 — brief → pptx
    router: business/skills/officecli-pitch-deck/SKILL.md
    means:
      - id: pitch_deck
        ref: business/skills/officecli-pitch-deck/SKILL.md
      - id: morph_ppt
        ref: business/skills/morph-ppt/SKILL.md

  - id: xhs-operations
    task_types: [publish-post]
    description: 小红书运营 — 笔记成稿与发布留痕
    router: business/skills/product-methodology/SKILL.md
    means: []

  - id: zhihu-operations
    task_types: [publish-post]
    description: 知乎运营 — 专栏成稿与发布留痕
    router: business/skills/product-methodology/SKILL.md
    means: []

  - id: product-operations
    task_types: [research, requirements, strategy, acceptance-report, decision-record]
    description: 产品专家共享包
    router: business/skills/product-methodology/SKILL.md
    means: []

  - id: research
    task_types: [research]
    router: business/skills/product-methodology/SKILL.md

  - id: requirements
    task_types: [requirements]
    router: business/skills/product-methodology/SKILL.md

  - id: strategy
    task_types: [strategy]
    router: business/skills/product-methodology/SKILL.md

  - id: acceptance-report
    task_types: [acceptance-report]
    router: business/skills/product-methodology/SKILL.md

  - id: decision-record
    task_types: [decision-record]
    router: business/skills/product-methodology/SKILL.md

  - id: content
    task_types: [content]
    description: 内容成稿（图文/笔记）
    router: business/skills/product-methodology/SKILL.md

  - id: architecture-review
    task_types: [architecture-review]
    router: business/skills/system-architecture-methodology/SKILL.md

  - id: code-audit
    task_types: [code-audit]
    description: 代码健康检查 — 运行 tsc/eslint/pytest，生成评分仪表盘
    router: business/skills/code-audit/SKILL.md

  - id: code-writing
    task_types: [code-writing]
    router: business/skills/backend-engineering-methodology/SKILL.md

  - id: code-deliverable
    task_types: [code-deliverable]
    router: business/skills/backend-engineering-methodology/SKILL.md

  - id: code-review
    task_types: [code-review]
    router: business/skills/quality-review/SKILL.md

  - id: code-testing
    task_types: [code-testing]
    router: business/skills/qa-methodology/SKILL.md

  - id: test-plan
    task_types: [test-plan]
    router: business/skills/qa-methodology/SKILL.md

  # geo-* / data-analysis：内核 templates.yaml 直驱，无独立 Skill 目录
  - id: geo-kernel
    task_types: [geo-plan, geo-audit, geo-verification]
    description: GEO 任务（registry 直驱）
    router: business/skills/product-methodology/SKILL.md

  - id: config-bundle
    task_types: [config-bundle]
    description: 配置包（yaml/json）包态交付
    router: business/skills/backend-engineering-methodology/SKILL.md

  - id: data-analysis-kernel
    task_types: [data-analysis]
    description: 数据分析（registry 直驱）
    router: business/skills/product-methodology/SKILL.md

  - id: officecli
    task_types: [office-doc]
    description: Office 文档创建/分析/修改 — .docx / .xlsx / .pptx 全流程 CLI
    router: business/skills/officecli/SKILL.md
    means: []

  - id: prompt-optimizer
    task_types: [prompt-optimize]
    description: Prompt 质量评估与自动改写 — 使用 LLM 进行结构化评估和多轮迭代优化
    router: business/skills/prompt_optimizer/SKILL.md
    execution: business/skills/prompt_optimizer/SKILL.md

  - id: evaluation-rubric
    task_types: [evaluation-rubric]
    description: Evaluation rubric 生成器 — 交互式引导，为 goal prompt 产出评分标准
    router: business/skills/evaluation-rubric/SKILL.md

  - id: sop-to-workflow
    task_types: [workflow-design]
    description: 将人类SOP通过多轮对话转换为Agentic Workflow YAML
    router: business/skills/sop-to-workflow/SKILL.md
    means: []

  - id: workflow-creator
    task_types: [workflow-design]
    description: 将Agentic Workflow YAML转换为myteam完整配置
    router: business/skills/workflow-creator/SKILL.md
    means: []

  - id: competitive-analysis
    task_types: [competitive-analysis]
    description: 竞品分析 — 六步闭环流程，能力对比矩阵、优劣势、差异化机会
    router: business/skills/competitive-analysis-methodology/SKILL.md

  - id: business-diagnosis
    task_types: [business-diagnosis]
    description: 业务诊断 — 根因分析、改进建议、实施计划
    router: business/skills/product-methodology/SKILL.md

  - id: code-deployment
    task_types: [code-deployment]
    description: 部署上线 — 部署步骤、健康检查、回滚预案
    router: business/skills/backend-engineering-methodology/SKILL.md
