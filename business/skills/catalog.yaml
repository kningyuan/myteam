# Skill / Means 目录 — Agent 按 task_type 自选（workflow 不得写死路径）
version: "0.2"

skills:
  - id: arch-research
    task_types: [arch-research]
    description: 架构向桌面调研
    router: business/skills/arch-research/SKILL.md
    means: []

  - id: product-research
    task_types: [product-research]
    description: 产品向桌面调研
    router: business/skills/product-research/SKILL.md
    means: []

  - id: product-planning
    task_types: [product-planning]
    description: 产品说明·整体规划章节
    router: business/skills/product-planning/SKILL.md
    means: []

  - id: diagram-build
    task_types: [diagram-build]
    description: 架构/流程图 — brief → draw.io → PNG
    router: business/skills/diagram-build/SKILL.md
    means_root: business/means/diagram-build
    execution: business/means/diagram-build/EXECUTION.md
    probe: business/means/diagram-build/scripts/probe.sh
    verify: business/means/diagram-build/scripts/verify_diagram.py
    means:
      - id: brief_to_drawio
        script: business/means/diagram-build/scripts/brief_to_drawio.py
      - id: handwrite_drawio
        ref: business/means/diagram-build/references/drawing_spec.md
      - id: render_png
        script: business/means/diagram-build/scripts/build_diagram.sh
    deliverables: [diagram.drawio, diagram.png]

  - id: deck-build
    task_types: [deck-build]
    description: 演示文稿 — brief → pptx
    router: business/skills/deck-build/SKILL.md
    means_root: business/skills/wps-deck
    means:
      - id: wps_deck
        script: business/skills/wps-deck/scripts/build_deck.sh
      - id: python_pptx
        script: business/skills/wps-deck/scripts/build_deck_pptx.py

  - id: product-operations
    task_types: [research, requirements, strategy, acceptance-report, decision-record]
    description: 产品专家共享包
    router: business/skills/product-operations/SKILL.md
    means: []

  - id: research
    task_types: [research]
    router: business/skills/research/SKILL.md

  - id: requirements
    task_types: [requirements]
    router: business/skills/requirements/SKILL.md

  - id: strategy
    task_types: [strategy]
    router: business/skills/strategy/SKILL.md

  - id: acceptance-report
    task_types: [acceptance-report]
    router: business/skills/acceptance-report/SKILL.md

  - id: decision-record
    task_types: [decision-record]
    router: business/skills/decision-record/SKILL.md
