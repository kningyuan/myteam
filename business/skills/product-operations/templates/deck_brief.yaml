# 演示文稿 brief — 供 build_deck.sh / WPS 加载项使用
# 从 strategy/PRD 提炼，勿粘贴全文

title: "演示标题"
subtitle: "副标题或日期"
author: "product"
template: pitch   # pitch | report

slides:
  - type: title
    title: "演示标题"
    subtitle: "副标题"

  - type: section
    title: "背景与问题"

  - type: content
    title: "我们面对什么"
    bullets:
      - "要点一"
      - "要点二"
      - "要点三"

  - type: section
    title: "方案"

  - type: content
    title: "核心方案"
    bullets:
      - "方案要点 A"
      - "方案要点 B"

  - type: content
    title: "阶段规划"
    bullets:
      - "Phase 1：…"
      - "Phase 2：…"

  - type: section
    title: "风险与下一步"

  - type: content
    title: "风险与依赖"
    bullets:
      - "风险 1 + 缓解"

  - type: content
    title: "下一步"
    bullets:
      - "行动项 1"
      - "行动项 2"

  - type: closing
    title: "谢谢"
    subtitle: "Q & A"
