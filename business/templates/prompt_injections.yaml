# Prompt 注入 — 按 delivery_profile / task_type 拼块（Strategy Registry）
# 由 PromptComposer 调用；内核不硬编码业务文案。

version: "1.1"

injections:
  execute:
    by_delivery_profile:
      light_v1:
        blocks:
          - |
            【交付过程 · light_v1】须完成 Align + Verify，见 {all_playbook}
            过程产物（与 deliverable 同目录）：align.md、verify.log
            脚手架：{scaffold_script}
            框架已在同目录预写 align.md 模板与 verify.log；请先填写 align.md 再写 deliverable
            交卷前自检：① align.md 四节已填实质内容 ② deliverable 章节齐全 ③ verify.log 写入自检结论
      all_v1:
        blocks:
          - |
            【交付过程 · all_v1】须完成 Align→Launch→Learn，见 {all_playbook}
            过程产物：align.md、plan.md、verify.log、ledger.entry.yaml、trace.manifest.yaml
            脚手架：{scaffold_script}
            框架已预写过程模板；plan.md 须记录 chosen_skills 与 means
            交卷前自检：① align+plan 已填 ② means 探针输出写入 verify.log ③ ledger 填写 lesson
            【means 自选】读 catalog，在 plan.md 记录 chosen_skills 与 means：{catalog}
    by_task_type:
      product-planning:
        blocks:
          - |
            【架构图 · tds-ch3 等模板】与 deliverable 同目录须交付：
            - product-architecture.drawio + product-architecture.png（### 产品架构）
            - functional-architecture.drawio + functional-architecture.png（### 功能架构）
            作图可用 business/means/diagram-build/（probe.sh → brief_to_drawio.py / 手写 drawio → build_diagram.sh）
            verify.log 须记录 draw.io 探针与 PNG 导出；Markdown 内嵌 ![](product-architecture.png) 与 ![](functional-architecture.png)
      diagram-build:
        blocks:
          - |
            【means 执行】{diagram_execution}
            【探针】{diagram_probe}，输出写入 verify.log
            【业务产出】diagram.drawio、diagram.png 与 deliverable 同目录
            【交卷】verify_diagram.py 通过后再 submit_result
