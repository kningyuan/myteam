research:
  task_type: research
  display_name: 竞品调研
  outcome_kind: artifact
  delivery_profile: light_v1
  required_sections:
  - 调研背景
  - 信息来源
  - 关键发现
  - 结论
  deliverable_template:
    title: 竞品调研报告
    sections:
    - name: 调研背景
      description: 填写「调研背景」
      required: true
    - name: 信息来源
      description: 填写「信息来源」
      required: true
    - name: 关键发现
      description: 填写「关键发现」
      required: true
    - name: 结论
      description: 填写「结论」
      required: true
    required_heading_level: 2
  check_rules:
    required_sections:
    - 调研背景
    - 信息来源
    - 关键发现
    - 结论
    min_length: 500
  acceptance_criteria:
  - 完整覆盖调研背景章节且内容具体
  - 信息来源必须标注（URL/出处），禁止编造数据
  - 关键发现至少3条，含对比/优势/劣势
  - 结论含可执行建议（P0/P1/优先级/下一步）
  - 覆盖异常/边界场景，不能只写正常情况
section-review:
  task_type: section-review
  display_name: 同行评审
  outcome_kind: artifact
  delivery_profile: none
  required_sections:
  - 评审范围
  - 问题列表
  - 改进建议
  - 评审结论
  deliverable_template:
    title: 评审报告
    sections:
    - name: 评审范围
      description: 填写「评审范围」
      required: true
    - name: 问题列表
      description: 填写「问题列表」
      required: true
    - name: 改进建议
      description: 填写「改进建议」
      required: true
    - name: 评审结论
      description: 填写「评审结论」
      required: true
    required_heading_level: 2
  check_rules:
    required_sections:
    - 评审范围
    - 问题列表
    - 改进建议
    - 评审结论
    min_length: 200
  acceptance_criteria:
  - 覆盖评审范围、问题列表、改进建议、评审结论四章节
  - 问题列表每条须具体可定位（引用交付物原文/章节）
  - 改进建议须可执行（指明改哪里、怎么改）
  - '末行必须写 REVIEW: PASS 或 REVIEW: FAIL（大写，独占一行）'
  - 'REVIEW: FAIL 时问题列表不得为空'
custom-survey:
  display_name: 自定义调研
  deliverable_template:
    required_heading_level: 2
    sections:
    - name: 背景
      description: 填写「背景」
      required: true
    - name: 结论
      description: 填写「结论」
      required: true
  check_rules:
    required_sections:
    - 背景
    - 结论
    min_length: 200
  required_sections:
  - 背景
  - 结论
my-type:
  display_name: 我的类型
  deliverable_template:
    required_heading_level: 2
    sections:
    - name: 正文
      description: 填写「正文」章节
      required: true
  check_rules:
    required_sections:
    - 正文
    min_length: 200
data-analysis:
  display_name: 数据分析
  deliverable_template:
    required_heading_level: 2
    sections:
    - name: 正文
      description: 填写「正文」章节
      required: true
  check_rules:
    required_sections:
    - 分析问题与口径
    - 数据来源与质量
    - 分析过程与方法
    - 关键发现
    - 结论与行动建议
  outcome_kind: artifact
