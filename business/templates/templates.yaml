      required: true
    - name: 方案设计
      description: 填写「方案设计」章节
      required: true
    - name: 架构图
      description: 填写「架构图」章节
      required: true
    - name: 验收标准
      description: 填写「验收标准」章节
      required: true
  check_rules:
    required_sections:
    - 需求背景
    - 方案设计
    - 架构图
    - 验收标准
  task_type: feature-design
