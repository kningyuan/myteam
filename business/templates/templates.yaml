# OpenClaw 交付物模板配置
# 每个 task_type 包含 deliverable_template（Agent 撰写指引）和 check_rules（质量门禁规则）
# check_rules.required_sections 可从 sections 中 required=true 的自动推导，此处保留显式定义便于覆盖

research:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "调研背景"
        description: "说明本次调研的背景、目的、范围和方法论"
        required: true
        example: "随着AI生成式搜索引擎（如Perplexity、ChatGPT Search）的兴起，GEO（Generative Engine Optimization）成为新的优化领域。本报告系统调研了GEO的主流优化方式和前沿手段。"
      - name: "信息来源"
        description: "列出调研的数据来源，包括行业报告、官方文档、社区讨论等，评估每条来源的可信度"
        required: true
        example: "| 来源类型 | 具体来源 | 可信度 |\n|----------|----------|--------|\n| 行业报告 | Moz、Ahrefs | 高 |\n| 官方文档 | Perplexity Blog | 高 |"
      - name: "关键发现"
        description: "列出调研得出的核心发现，按重要性或主题分类，每个发现附证据"
        required: true
        example: "发现1：GEO优化在Perplexity中的引用率比传统SEO高3倍。依据：Moz 2024年研究报告显示..."
      - name: "结论"
        description: "总结调研结论，给出可操作的建议和下一步行动"
        required: true
        example: "GEO优化的核心在于内容质量+结构化数据+引用策略的三位一体。建议优先建立高质量内容库..."
      - name: "风险评估"
        description: "说明潜在局限、不确定性和建议关注的风险点"
        required: false
        example: "当前GEO领域变化较快，主流AI搜索的算法不透明，建议每季度更新一次策略。"
    structure:
      - "H1 标题作为报告主标题"
      - "每个章节使用 H2 标题"
      - "数据使用表格呈现"
      - "引用来源标注出处和链接"
  check_rules:
    required_sections:
      - "调研背景"
      - "信息来源"
      - "关键发现"
      - "结论"
    must_include:
      - "数据来源"
      - "可信度"
    min_length: 500

seo-plan:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "关键词研究"
        description: "列出核心词、长尾词、竞品词的分布和策略"
        required: true
        example: "| 关键词类型 | 核心词 | 搜索量 | 竞争度 |\n|------------|--------|--------|--------|\n| 核心词 | GEO优化 | 2400/月 | 高 |\n| 长尾词 | GEO优化SEO区别 | 320/月 | 低 |"
      - name: "技术优化"
        description: "Core Web Vitals 优化建议、页面加载速度、移动端适配、结构化数据"
        required: true
        example: "Core Web Vitals 现状：LCP 2.8s（目标<2.5s），FID 85ms（达标），CLS 0.12（目标<0.1）。建议：图片WebP转换预计降低LCP至1.8s..."
      - name: "内容策略"
        description: "内容主题规划、更新频率、EEAT信号建设方案"
        required: true
        example: "内容主题集群：GEO基础（5篇）、GEO进阶（8篇）、行业案例（10篇）。EEAT建设：引入行业专家作者、建立引用库..."
      - name: "效果预估"
        description: "量化预期指标，包括排名变化、流量增长、转化提升"
        required: true
        example: "预期3个月内：AI搜索结果引用率提升50%，自然搜索流量增长30%，转化率提升15%。"
    structure:
      - "H1 标题作为方案主标题"
      - "每个章节使用 H2 标题"
      - "数据使用表格呈现"
  check_rules:
    required_sections:
      - "关键词研究"
      - "技术优化"
      - "内容策略"
      - "效果预估"
    must_include:
      - "核心词"
      - "长尾词"
      - "竞品词"
      - "Core Web Vitals"
    min_length: 400

content:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "目标读者"
        description: "明确内容的目标受众、阅读场景和核心需求"
        required: true
        example: "目标读者：SEO从业者（3-5年经验），正在寻找GEO优化实操方法。阅读场景：工作中遇到AI搜索流量问题，需要系统化解决方案。"
      - name: "内容结构"
        description: "展示全文的章节划分和逻辑流"
        required: true
        example: "引言：GEO与传统SEO的区别 / 主体：四大优化策略 + 实操步骤 / 结论：总结建议 + 下一步行动"
      - name: "正文内容"
        description: "核心内容，需包含关键词研究和目标受众分析"
        required: true
        example: "## 一、GEO优化基础\nGEO（Generative Engine Optimization）是针对AI生成式搜索引擎的优化实践。与传统SEO不同..."
      - name: "引用来源"
        description: "标注所有引用来源的具体出处和链接"
        required: true
        example: "1. Moz, 'The State of GEO 2024', https://moz.com/geo-report\n2. Perplexity AI, 'How Perplexity Sources Content', https://blog.perplexity.ai/sourcing"
    structure:
      - "H1 标题作为文章主标题"
      - "每个章节使用 H2 标题"
      - "引用使用序号标注"
  check_rules:
    required_sections:
      - "目标读者"
      - "内容结构"
      - "正文内容"
      - "引用来源"
    must_include:
      - "关键词研究"
      - "目标读者"
    min_length: 300

test-plan:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "测试范围"
        description: "说明本次测试的覆盖范围、被测功能和排除项"
        required: true
        example: "测试范围：GEO优化模块的AI搜索结果验证功能。包括：结果正确性、引用来源准确性、多语言支持。不包括：性能测试和安全测试。"
      - name: "测试用例"
        description: "列出具体测试用例，每个用例包含输入、操作步骤、预期结果"
        required: true
        example: "| 用例ID | 测试场景 | 输入 | 预期结果 |\n|--------|----------|------|----------|\n| TC-001 | 基础查询 | 'GEO优化怎么做' | 返回5条以上结果，含引用来源 |"
      - name: "正常路径"
        description: "描述核心功能的主流使用路径和验证点"
        required: true
        example: "用户输入查询→系统调用AI搜索→返回结构化结果→用户点击引用来源→跳转正常"
      - name: "边界条件"
        description: "测试输入的边界值、空值、异常值"
        required: true
        example: "空查询：返回友好提示；超长查询（>500字）：截断处理；特殊字符：HTML标签转义"
      - name: "异常路径"
        description: "测试网络中断、超时、服务不可用等异常场景"
        required: true
        example: "AI搜索超时：返回缓存结果+提示；API限流：降级到基础搜索；服务不可用：显示维护页面"
    structure:
      - "H1 标题作为测试计划主标题"
      - "每个章节使用 H2 标题"
      - "用例使用表格呈现"
  check_rules:
    required_sections:
      - "测试范围"
      - "测试用例"
      - "正常路径"
      - "边界条件"
      - "异常路径"
    must_include:
      - "测试数据"
      - "预期结果"
    min_length: 300

code-deliverable:
  outcome_kind: code_project
  acceptance_criteria:
    - "deliverables/<task_id>/ 目录内包含可运行脚本与 README"
    - "output/ 中有运行产出或运行说明"
  deliverable_template:
    sections:
      - name: "脚本/代码"
        description: "可执行主程序或核心源码，放工程根目录"
        example: "collect_hw_info.sh、main.py"
      - name: "README.md"
        description: "使用说明：依赖、运行命令、参数、示例输出"
        example: "说明如何 chmod +x 后执行，output/ 下生成何种报告"
      - name: "output/"
        description: "脚本真实运行后的产出（报告、日志、生成物）"
        example: "output/hw_report.md"
    structure:
      - "根目录：deliverables/<task_id>/"
      - "脚本在根目录，运行产出在 output/"
      - "交付物是代码工程，不是单篇 Markdown"
  check_rules:
    min_project_files: 2
    require_code_file: true
    file_exists:
      - "README.md"

strategy:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "背景"
        description: "说明战略的背景、触发因素和决策上下文"
        required: true
        example: "随着GEO成为SEO行业新热点，团队需要明确是否投入资源建设GEO能力以及投入优先级。"
      - name: "分析"
        description: "多维度分析，包括SWOT、竞品对比、资源评估"
        required: true
        example: "SWOT分析：优势（已有高质量内容库）、劣势（缺乏结构化数据）、机会（AI搜索流量增长300%）、威胁（竞品已布局）"
      - name: "方案"
        description: "列出多个可选方案，每个方案有清晰的优缺点和适用条件"
        required: true
        example: "方案A：全面铺开（3个月，预算50万）。方案B：试点先行（1个月，预算10万）。方案C：按兵不动（零投入）。"
      - name: "建议"
        description: "给出推荐方案和下一步行动计划"
        required: true
        example: "推荐方案B：以内容优化和结构化数据为切入点，1个月内完成试点，根据效果数据决定是否扩大投入。"
    structure:
      - "H1 标题作为报告主标题"
      - "每个章节使用 H2 标题"
      - "对比使用表格呈现"
  check_rules:
    required_sections:
      - "背景"
      - "分析"
      - "方案"
      - "建议"
    must_include:
      - "不确定性"
    min_length: 300

# 动作型任务：交付物 = 动作证据（已发布URL/截图），非纸面方案。
# 质量门禁会真实访问「已发布URL」并校验页面含「帖子标题」，证明动作真发生。
publish-post:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "发布平台"
        description: "实际发布的平台名称与账号"
        required: true
        example: "平台：知乎专栏（zhuanlan.zhihu.com）"
      - name: "帖子标题"
        description: "已发布内容的真实标题（必须与线上页面一致，门禁据此校验）"
        required: true
        example: "GEO优化实战：如何让内容被AI搜索引用"
      - name: "已发布URL"
        description: "线上可访问的发布链接（http/https），门禁会真实访问校验"
        required: true
        example: "https://zhuanlan.zhihu.com/p/123456789"
      - name: "证据截图"
        description: "发布成功后的页面截图文件路径（相对交付物目录）"
        required: true
        example: "evidence/zhihu-post-20260529.png"
      - name: "正文摘要"
        description: "已发布正文的简要说明与关键词布局"
        required: false
        example: "围绕「GEO优化」核心词，覆盖长尾词3个，含1处结构化要点列表。"
    structure:
      - "H1 标题作为记录主标题"
      - "每个章节使用 H2 标题"
      - "已发布URL 单独成行，便于门禁提取"
  check_rules:
    required_sections:
      - "发布平台"
      - "帖子标题"
      - "已发布URL"
      - "证据截图"
    must_include:
      - "https://"
    min_length: 20
    # 动作证据校验：URL 须为发布页形态(/p/)+截图须存在；实时核对标题为加分项。
    evidence_url:
      host_contains: "zhihu.com"
      url_must_match: "zhuanlan.zhihu.com/p/"
      screenshot_field: "证据截图"
      verify_title: true

system-design:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "问题与约束"
        description: "业务目标、非功能性需求、边界条件、不可逆风险"
        required: true
        example: "目标：为编排内核增加任务重试策略配置。约束：不改变 Gate 契约；NFR：配置热加载 <1s。"
      - name: "领域与边界"
        description: "Bounded context、模块划分、上下游依赖、数据流"
        required: true
        example: "Process 负责调度；Store 负责持久化；Registry 提供 task_type 约束。配置从 Strategy Registry 读取。"
      - name: "架构方案"
        description: "至少两个可选方案 + trade-off 矩阵与推荐结论"
        required: true
        example: "方案 A：YAML 扩展字段（可逆、低改动）；方案 B：独立 retry_policy 表（灵活、迁移成本高）。推荐 A。"
      - name: "接口契约"
        description: "API/事件/存储接口、错误语义、版本与兼容策略"
        required: true
        example: "RetryPolicy(max_attempts, backoff_ms, task_types[])；Store 新增 get_retry_policy(task_type)。"
      - name: "演化与风险"
        description: "迁移路径、回滚策略、技术债与后续拆分建议"
        required: true
        example: "Phase1 仅支持全局默认；Phase2 按 task_type 覆盖。回滚：删除新字段，默认值兜底。"
    structure:
      - "H1 标题作为方案主标题"
      - "每个章节使用 H2 标题"
      - "重要决策附 ADR 编号或内嵌 ADR 小节"
  check_rules:
    required_sections:
      - "问题与约束"
      - "领域与边界"
      - "架构方案"
      - "接口契约"
      - "演化与风险"
    must_include:
      - "trade-off"
    min_length: 400

architecture-review:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "评审范围"
        description: "被评审的模块/PR/设计文档与评审标准"
        required: true
        example: "范围：backend/common/process.py 重试逻辑与 Store 交互。标准：依赖方向、可测试性、可观测性。"
      - name: "现状摘要"
        description: "当前架构、数据流、关键依赖的客观描述"
        required: true
        example: "Process 在任务失败时直接 mark_failed；无退避；Store 无 retry 计数持久化。"
      - name: "发现与分级"
        description: "按 🔴/🟡/💭 分级列出问题，附位置与理由"
        required: true
        example: "🔴 失败路径无幂等保护，重复执行可能双写。🟡 缺结构化日志关联 run_id。"
      - name: "技术债务"
        description: "债务清单、影响面、建议偿还优先级"
        required: true
        example: "TD-1：Gate 与 Registry 重复校验逻辑 — 中优先级，合并为单入口。"
      - name: "演进建议"
        description: "可执行的改进路线与依赖顺序"
        required: true
        example: "1) 补 ADR-012 重试语义；2) Store 增 retry_count；3) 单测覆盖边界。"
    structure:
      - "H1 标题作为评审报告主标题"
      - "发现项使用分级标记"
  check_rules:
    required_sections:
      - "评审范围"
      - "现状摘要"
      - "发现与分级"
      - "技术债务"
      - "演进建议"
    min_length: 300

code-review:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "变更摘要"
        description: "本次审查的 diff 范围、整体印象、主要关注点"
        required: true
        example: "审查 PR：新增 retry_policy 模块，+320/-45 行。整体结构清晰；关注并发与 Store 事务边界。"
      - name: "审查意见"
        description: "按 🔴 blocker / 🟡 suggestion / 💭 nit 列出，每条含位置、原因、建议"
        required: true
        example: "🔴 store.py:142 — 更新 retry_count 未在事务内，可能丢计数。建议：与 task 状态同事务提交。"
      - name: "优点"
        description: "值得保留的好模式与清晰实现"
        required: true
        example: "RetryPolicy 用 Pydantic 建模，与 contracts 风格一致；单测覆盖退避计算。"
      - name: "结论"
        description: "是否建议合并、阻塞项清单、后续跟进"
        required: true
        example: "修复 1 个 🔴 后可合并；建议补集成测验证失败重试全路径。"
    structure:
      - "H1 标题作为审查报告主标题"
      - "意见项带文件/行号引用"
  check_rules:
    required_sections:
      - "变更摘要"
      - "审查意见"
      - "优点"
      - "结论"
    min_length: 200

code-writing:
  outcome_kind: code_project
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "需求说明"
        description: "本次代码编写的功能需求、输入/输出定义、约束条件"
        required: true
        example: "实现一个REST API接口 GET /api/users/{id}，返回用户信息JSON。输入：用户ID（UUID格式）。输出：{id, name, email, role}。约束：响应时间<200ms。"
      - name: "实现方案"
        description: "技术选型、架构设计、核心数据结构定义"
        required: true
        example: "采用FastAPI + SQLAlchemy异步查询。数据模型：User(id: UUID, name: str, email: str, role: str)。缓存层：Redis TTL=60s。"
      - name: "代码清单"
        description: "列出本次涉及的所有文件路径和核心代码片段（非全文，标注关键逻辑）"
        required: true
        example: "新增文件：app/routers/users.py（路由+业务逻辑）、app/schemas/user.py（Pydantic模型）。修改文件：app/main.py（注册路由）。"
      - name: "质量说明"
        description: "代码规范性、边界处理、错误处理、日志记录、安全考虑"
        required: true
        example: "输入校验：UUID格式验证、404处理。日志：所有查询记录耗时。安全：接口限流 100req/min。错误：统一异常处理 + 结构化错误响应。"
    structure:
      - "H1 标题作为文档主标题"
      - "交付物为 deliverables/<task_id>/ 代码工程目录"
  check_rules:
    min_project_files: 2
    require_code_file: true
    file_exists:
      - "README.md"

code-testing:
  outcome_kind: code_project
  acceptance_criteria:
    - "测试用例、测试记录、测试报告以实体文件存在于工程目录"
    - "output/ 或 reports/ 中有执行产出"
  deliverable_template:
    sections:
      - name: "tests/cases.md"
        description: "测试用例清单（输入、预期、边界，可用表格）"
        example: "TC-001 正常运行；TC-002 --help；TC-003 脱敏校验"
      - name: "reports/test_report.md"
        description: "测试报告：范围、结论、缺陷列表、质量评分"
        example: "通过 10/13，P0 缺陷 2 个，附复现步骤"
      - name: "output/"
        description: "执行记录：命令输出、日志、覆盖率、截图路径"
        example: "output/run.log、output/hw_report.md"
    structure:
      - "根目录：deliverables/<task_id>/"
      - "tests/ 放用例，reports/ 放报告，output/ 放执行记录"
      - "交付物是测试工程（多文件），不是单篇说明文档"
  check_rules:
    min_project_files: 3
    file_exists:
      - "tests/cases.md"
      - "reports/test_report.md"

# PGD 通用阶段闸门：需求定稿（software-delivery / content-campaign 等 workflow 共用）
requirements:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "背景与目标"
        description: "触发原因、要解决的问题、成功标准（可量化）"
        required: true
        example: "背景：多 Agent 切换会误杀后台流。目标：切换不中断其它 Agent 任务；DAG/时间线可观测。"
      - name: "范围"
        description: "In Scope / Out of Scope、边界与假设"
        required: true
        example: "In：frontend 流隔离、claude usage 采集。Out：Hub API 契约变更、kernel DAG 重写。"
      - name: "用户故事与验收标准"
        description: "按角色列用户故事；每条附可验证的验收条件（R1/R2…）"
        required: true
        example: "| ID | 故事 | 验收 |\n| R1 | 切换 Agent 不杀后台流 | 2 Agent 并发手工场景通过 |"
      - name: "方案方向"
        description: "可选方案摘要或推荐路径（细节在 system-design 阶段展开）"
        required: true
        example: "推荐：按 agentId 隔离 AbortController；Token 在 parser 末行采 usage。"
      - name: "风险与依赖"
        description: "技术/进度风险、外部依赖、需协调方"
        required: true
        example: "风险：Phase2 DOM 改造范围上浮。依赖：FIX-② 字段名对齐后方可验 DAG。"
    structure:
      - "H1 标题作为需求文档主标题"
      - "验收标准使用表格"
      - "版本号写在标题或文首 meta（如 v1 / v2）"
  check_rules:
    required_sections:
      - "背景与目标"
      - "范围"
      - "用户故事与验收标准"
      - "方案方向"
      - "风险与依赖"
    must_include:
      - "Out of Scope"
    min_length: 400

# PGD 通用：仲裁者对各角色评审的采纳记录；无未关闭 🔴 方可过 Gate
decision-record:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "评审范围"
        description: "本决策针对的上游 artifact（task_id、版本、链接）"
        required: true
        example: "范围：req-draft v1；输入：review-arch / review-frontend / review-qa 三份评审。"
      - name: "反馈汇总"
        description: "按来源汇总意见；🔴/🟡/💭 分级"
        required: true
        example: "| 来源 | 级别 | 摘要 |\n| qa | 🔴 | 缺 R3 验收口径 |"
      - name: "采纳决策"
        description: "每条反馈：采纳/不采纳 + 理由；采纳项如何反映到下一版 artifact"
        required: true
        example: "采纳 qa-R3：在 req-final 补并发验收表。不采纳：暂不做法务评审（本期无对外发布）。"
      - name: "阻塞项处理"
        description: "所有 🔴 的处理结果；必须明确已关闭或升级路径"
        required: true
        example: "🔴-1（qa 验收口径）→ 已纳入 req-final §验收。当前开放 🔴：0。"
      - name: "阶段结论"
        description: "本阶段是否通过、锁定版本号、下游可开始的 task"
        required: true
        example: "结论：requirements 阶段通过；锁定 req-final v2；可开始 design-backend / design-frontend。"
    structure:
      - "H1 标题含阶段名（如「需求阶段决策记录」）"
      - "阻塞项处理须含开放 🔴 计数"
  check_rules:
    required_sections:
      - "评审范围"
      - "反馈汇总"
      - "采纳决策"
      - "阻塞项处理"
      - "阶段结论"
    must_include:
      - "🔴"
      - "结论"
      - "开放 🔴：0"
    min_length: 250

# PGD 通用：产品+测试对交付物的联合验收
acceptance-report:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "验收范围"
        description: "对照的需求版本、交付 commit/版本、环境"
        required: true
        example: "需求：req-final v2。交付：upgrade/continued @ abc123。环境：本地 Hub 8765。"
      - name: "验收结果"
        description: "逐条对照 R1/Rn；通过/不通过 + 证据"
        required: true
        example: "| 标准 | 结果 | 证据 |\n| R1 | 通过 | 并发场景录屏 + 日志 |"
      - name: "遗留项"
        description: "未通过项、已知限制、是否阻塞发布"
        required: true
        example: "遗留：群聊 Phase2 实时滚动（非阻塞，记入下一迭代）。"
      - name: "发布建议"
        description: "建议发布/暂缓；回滚要点；需人工确认项"
        required: true
        example: "建议：可合入。回滚：revert PR-1~3。需大元帅确认：无。"
    structure:
      - "H1 标题作为验收报告主标题"
      - "验收结果使用表格对照需求 ID"
  check_rules:
    required_sections:
      - "验收范围"
      - "验收结果"
      - "遗留项"
      - "发布建议"
    must_include:
      - "通过"
    min_length: 200

code-deployment:
  deliverable_template:
    required_heading_level: 2
    sections:
      - name: "部署概要"
        description: "部署目标环境、发布版本/commit、部署方式"
        required: true
        example: "环境：staging（k8s namespace: staging）。版本：v2.1.0 (commit: a1b2c3d)。部署方式：滚动更新，maxSurge=1, maxUnavailable=0。"
      - name: "部署步骤"
        description: "按顺序列出每一步操作命令或操作说明"
        required: true
        example: "1. 拉取镜像：docker pull registry.internal/myapp:v2.1.0\n2. 更新 deployment：kubectl set image deployment/myapp app=registry.internal/myapp:v2.1.0 -n staging\n3. 等待就绪：kubectl rollout status deployment/myapp -n staging --timeout=300s"
      - name: "验证结果"
        description: "部署后的验证方式与结果（健康检查、功能冒烟、日志确认）"
        required: true
        example: "健康检查：curl -f http://staging.myapp.internal/health → 200 OK。冒烟测试：API 3/3 passed。日志确认：无 ERROR 级别新日志。"
      - name: "回滚方案"
        description: "部署失败的判定标准与回滚操作"
        required: true
        example: "判定：健康检查连续3次失败 OR 错误率上升 >5%。回滚：kubectl rollout undo deployment/myapp -n staging。预计恢复时间：<2分钟。"
    structure:
      - "H1 标题作为部署记录主标题"
      - "每个章节使用 H2 标题"
      - "命令使用代码块"
  check_rules:
    required_sections:
      - "部署概要"
      - "部署步骤"
      - "验证结果"
      - "回滚方案"
    must_include:
      - "健康检查"
    min_length: 200