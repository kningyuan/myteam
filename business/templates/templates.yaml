architecture-review:
  display_name: 架构评审
  description: 对系统设计方案进行架构视角审计，识别技术风险并给出建议
  outcome_kind: artifact
  delivery_profile: light_v1
  check_rules:
    required_sections:
    - 概述
    - 架构分析
    - 技术风险
    - 改进建议
    min_length: 200
    stub_floor: 100
    file_exists: []
    must_include:
    - 技术风险识别
    - 改进建议
  acceptance_criteria:
  - 概述清晰说明评审目标和范围
  - 架构分析覆盖关键设计决策及其理由
  - 技术风险按严重程度分级（高/中/低）
  - 改进建议具体可执行，与风险一一对应
  - 末行包含评审结论标记
  required_extensions:
  - md
decision-record:
  display_name: 决策记录
  description: 评审/讨论结论的正式记录，包含决策内容、理由和后续行动
  outcome_kind: artifact
  delivery_profile: none
  check_rules:
    required_sections:
    - 决策内容
    - 决策理由
    - 后续行动
    min_length: 100
    stub_floor: 50
    file_exists: []
  acceptance_criteria:
  - 决策内容明确无歧义
  - 理由包含具体的技术/业务考量
  - 后续行动有时间节点或负责人
  required_extensions:
  - md
custom-survey:
  display_name: 自定义调研
  deliverable_template:
    required_heading_level: 2
    sections:
    - name: 背景
      description: 填写「背景」
      required: true
    - name: 结论
      description: 填写「结论」
      required: true
  check_rules:
    required_sections:
    - 背景
    - 结论
    min_length: 200
  required_sections:
  - 背景
  - 结论
my-type:
  display_name: 我的类型
  deliverable_template:
    required_heading_level: 2
    sections:
    - name: 正文
      description: 填写「正文」章节
      required: true
  check_rules:
    required_sections:
    - 正文
    min_length: 200
