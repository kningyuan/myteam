research:
  task_type: research
  display_name: 竞品调研
  outcome_kind: artifact
  delivery_profile: light_v1
section-review:
  task_type: section-review
  display_name: 同行评审
  outcome_kind: artifact
  delivery_profile: none
  required_sections:
  - 评审范围
  - 问题列表
  - 改进建议
  - 评审结论
  deliverable_template:
    title: 评审报告
    sections:
    - name: 评审范围
      description: 填写「评审范围」
      required: true
    - name: 问题列表
      description: 填写「问题列表」
      required: true
    - name: 改进建议
      description: 填写「改进建议」
      required: true
    - name: 评审结论
      description: 填写「评审结论」
      required: true
    required_heading_level: 2
  check_rules:
    required_sections:
    - 评审范围
    - 问题列表
    - 改进建议
    - 评审结论
    min_length: 200
  acceptance_criteria:
  - 覆盖评审范围、问题列表、改进建议、评审结论四章节
  - 问题列表每条须具体可定位（引用交付物原文/章节）
  - 改进建议须可执行（指明改哪里、怎么改）
  - '末行必须写 REVIEW: PASS 或 REVIEW: FAIL（大写，独占一行）'
  - 'REVIEW: FAIL 时问题列表不得为空'
custom-survey:
  display_name: 自定义调研
  deliverable_template:
    required_heading_level: 2
    sections:
    - name: 背景
      description: 填写「背景」
      required: true
    - name: 结论
      description: 填写「结论」
      required: true
  check_rules:
    required_sections:
    - 背景
    - 结论
    min_length: 200
  required_sections:
  - 背景
  - 结论
my-type:
