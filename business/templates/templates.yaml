publish-post:
  display_name: 内容发布
  outcome_kind: action
  delivery_profile: none
  deliverable_template:
    required_heading_level: 2
    sections:
    - name: 发布平台
      description: 填写「发布平台」章节
      required: true
    - name: 帖子标题
      description: 填写「帖子标题」章节
      required: true
    - name: 已发布URL
      description: 填写「已发布URL」章节
      required: true
    - name: 证据截图
      description: 填写「证据截图」章节
      required: true
  check_rules:
    required_sections:
    - 发布平台
    - 帖子标题
    - 已发布URL
    - 证据截图
    evidence_url:
      host_contains: zhihu.com
      screenshot_field: 证据截图
      verify_title: true
    min_length: 50
  task_type: publish-post
  acceptance_criteria:
  - 含合规已发布 URL（zhihu.com 域名）
  - 含帖子标题，与已发布页一致
  - 含证据截图文件路径且文件存在
code-deliverable:
  display_name: 代码交付
  outcome_kind: code_project
  delivery_profile: none
  deliverable_template:
    required_heading_level: 2
    sections:
    - name: README
      description: 项目说明文档
      required: true
    - name: 源代码
      description: 至少含一个代码/脚本文件
      required: true
  check_rules:
    required_sections:
    - README
    - 源代码
    min_project_files: 2
    require_code_file: true
  task_type: code-deliverable
  acceptance_criteria:
  - 工程目录存在且至少含 2 个文件
  - 至少含一个代码/脚本文件（.py/.sh/.js/.ts 等）
  - 含 README 说明文档
