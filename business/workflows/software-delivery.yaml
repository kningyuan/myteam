# PGD Profile: 软件交付（功能 / 平台 / myteam 自升级）
id: software-delivery
version: "1.0"
description: >
  章程后走需求会诊→方案会诊→前后端实现→测试→部署→验收。
  每阶段以 decision-record 仲裁；🔴 阻塞须清零方可进入下游。

roster:
  required: [main, product, arch, frontend, qa]

options:
  review_enabled: true
  split_enabled: false

phases:
  - id: requirements
    name: 需求对齐
  - id: design
    name: 方案对齐
  - id: deliver
    name: 实现与验证
  - id: acceptance
    name: 验收与发布

tasks:
  # ── 需求 ─────────────────────────────────────────────
  - id: req-draft
    phase: requirements
    name: 需求草案
    agent: product
    task_type: requirements
    dependencies: []
    description: 根据项目 goal 撰写需求草案 v1（背景、范围、验收标准、非目标）。

  - id: review-req-arch
    phase: requirements
    name: 架构评审（需求）
    agent: arch
    task_type: architecture-review
    dependencies: [req-draft]
    description: 从后端/内核/数据/可观测性角度评审 req-draft；🔴 须可执行关闭。

  - id: review-req-frontend
    phase: requirements
    name: 前端评审（需求）
    agent: frontend
    task_type: architecture-review
    dependencies: [req-draft]
    description: 从 UI/交互/前端数据流角度评审 req-draft。

  - id: review-req-qa
    phase: requirements
    name: 测试评审（需求）
    agent: qa
    task_type: test-plan
    dependencies: [req-draft]
    description: 从可测性、验收口径、回归范围评审 req-draft；列出测试关注点。

  - id: req-decision
    phase: requirements
    name: 需求阶段决策记录
    agent: main
    task_type: decision-record
    dependencies: [review-req-arch, review-req-frontend, review-req-qa]
    description: 汇总三路评审；产出采纳表；开放 🔴 必须为 0。

  - id: req-final
    phase: requirements
    name: 需求定稿
    agent: product
    task_type: requirements
    dependencies: [req-decision]
    description: 需求定稿 v2，体现 req-decision 采纳项；文首标明相对 v1 的变更。

  # ── 方案 ─────────────────────────────────────────────
  - id: design-backend
    phase: design
    name: 后端/内核方案
    agent: arch
    task_type: system-design
    dependencies: [req-final]
    description: 后端与内核改动方案；含 trade-off、接口契约、回滚。

  - id: design-frontend
    phase: design
    name: 前端方案
    agent: frontend
    task_type: system-design
    dependencies: [req-final]
    description: 前端/UI 方案；与 adapter 隔离等约束对齐。

  - id: review-design-fe-on-be
    phase: design
    name: 前端评后端方案
    agent: frontend
    task_type: architecture-review
    dependencies: [design-backend, design-frontend]
    description: 评审 design-backend 对前端/API 的影响。

  - id: review-design-be-on-fe
    phase: design
    name: 后端评前端方案
    agent: arch
    task_type: architecture-review
    dependencies: [design-backend, design-frontend]
    description: 评审 design-frontend 是否违反内核边界或契约。

  - id: review-design-qa
    phase: design
    name: 测试评方案
    agent: qa
    task_type: architecture-review
    dependencies: [design-backend, design-frontend]
    description: 评审可测性、自动化与发布验证策略。

  - id: design-decision
    phase: design
    name: 方案阶段决策记录
    agent: main
    task_type: decision-record
    dependencies: [review-design-fe-on-be, review-design-be-on-fe, review-design-qa]
    description: 方案阶段仲裁；锁定实现依据；开放 🔴 为 0。

  # ── 交付 ─────────────────────────────────────────────
  - id: impl-backend
    phase: deliver
    name: 后端实现
    agent: arch
    task_type: code-writing
    dependencies: [design-decision]
    reviewer: frontend
    description: 按已定方案实现后端/内核改动；交付 code_project。

  - id: impl-frontend
    phase: deliver
    name: 前端实现
    agent: frontend
    task_type: code-writing
    dependencies: [design-decision]
    reviewer: arch
    description: 按已定方案实现前端改动；交付 code_project。

  - id: review-code-backend
    phase: deliver
    name: 后端代码审查
    agent: qa
    task_type: code-review
    dependencies: [impl-backend]
    description: 审查后端实现与 req-final、design-backend 的一致性。

  - id: review-code-frontend
    phase: deliver
    name: 前端代码审查
    agent: arch
    task_type: code-review
    dependencies: [impl-frontend]
    description: 审查前端实现与方案一致性。

  - id: test-regression
    phase: deliver
    name: 回归测试
    agent: qa
    task_type: code-testing
    dependencies: [review-code-backend, review-code-frontend]
    description: 按 req-final 验收标准执行测试；产出 cases + report。

  - id: deploy
    phase: deliver
    name: 部署记录
    agent: main
    task_type: code-deployment
    dependencies: [test-regression]
    description: 部署/合入步骤、验证、回滚方案（本地或目标环境）。

  # ── 验收 ─────────────────────────────────────────────
  - id: acceptance
    phase: acceptance
    name: 联合验收
    agent: product
    task_type: acceptance-report
    dependencies: [deploy]
    description: 对照 req-final 逐条验收；与 qa 结论交叉引用。

  - id: release-decision
    phase: acceptance
    name: 发布决策
    agent: main
    task_type: decision-record
    dependencies: [acceptance]
    description: 发布/暂缓决策；遗留项是否阻塞；需人工确认项明示。
