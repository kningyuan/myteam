id: 代码评审-round
name: PR 代码评审
version: "1.0"
description: |
  gstack 映射：/review — 结构与安全向预着陆评审。
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: false
tasks:
  - id: task-1
    name: PR 评审循环
    loop: pr_review_round
    dependencies: []
    description: |
      架构/测试双视角评审 → 协调者汇总。
loops:
  - id: pr_review_round
    max_rounds: 3
    min_rounds: 1
    default_body: default
    on_pass: complete
    on_exhaust: needs_review
    bodies:
      default:
        - id: step-arch-review
          name: 架构与安全评审
          agent: arch
          task_type: code-review
          dependencies: []
          description: |
            【gstack】/review
            【范围】diff、SQL 安全、信任边界、条件副作用；不修改代码
            【交付】deliverables/pr-arch-review.md
        - id: step-qa-review
          name: 质量与测试评审
          agent: qa
          task_type: code-review
          dependencies:
            - step-arch-review
          description: |
            【范围】测试覆盖、回归风险、可观测性
            【交付】deliverables/pr-qa-review.md
            【质量】末行 REVIEW: PASS 或 REVIEW: FAIL
        - id: step-summary
          name: 评审汇总
          agent: main
          task_type: decision-record
          dependencies:
            - step-qa-review
          description: |
            【交付】deliverables/pr-review-summary.md（合并结论与 merge 建议）
    assess:
      ref: step-qa-review
      inputs:
        - kind: goal
        - kind: phase.deliverable
          phase: step-arch-review
    transition:
      - when: deliverable_marker
        task: step-qa-review
        marker: "REVIEW: PASS"
        action: exit
        outcome: complete
      - when: deliverable_marker
        task: step-qa-review
        marker: "REVIEW: FAIL"
        action: continue
        next_body: default
      - when: exhausted
        action: exit
        outcome: needs_review
