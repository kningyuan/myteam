id: 设计评审-round
name: 设计评审
version: "1.0"
description: |
  gstack 映射：/design-review — 视觉与交互 QA（有 UI 时）。
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: false
tasks:
  - id: task-1
    name: 设计评审循环
    loop: design_review_round
    dependencies: []
    description: |
      前端视觉评审 → 测试可用性 → 汇总。
loops:
  - id: design_review_round
    max_rounds: 3
    min_rounds: 1
    default_body: default
    on_pass: complete
    on_exhaust: needs_review
    bodies:
      default:
        - id: step-visual
          name: 视觉与一致性
          agent: frontend
          task_type: code-review
          dependencies: []
          description: |
            【gstack】/design-review
            【Skill】需浏览器时挂载 browse skill
            【范围】间距、层级、响应式；附截图路径
            【交付】deliverables/design-visual-review.md
        - id: step-ux
          name: 交互与可用性
          agent: qa
          task_type: code-testing
          dependencies:
            - step-visual
          description: |
            【范围】关键路径、加载与错误态
            【交付】deliverables/design-ux-review.md
            【质量】末行 DESIGN: PASS 或 DESIGN: FAIL
        - id: step-summary
          name: 设计评审汇总
          agent: main
          task_type: decision-record
          dependencies:
            - step-ux
          description: |
            【交付】deliverables/design-review-summary.md
    assess:
      ref: step-ux
      inputs:
        - kind: goal
        - kind: phase.deliverable
          phase: step-visual
    transition:
      - when: deliverable_marker
        task: step-ux
        marker: "DESIGN: PASS"
        action: exit
        outcome: complete
      - when: deliverable_marker
        task: step-ux
        marker: "DESIGN: FAIL"
        action: continue
        next_body: default
      - when: exhausted
        action: exit
        outcome: needs_review
