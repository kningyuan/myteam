id: 第三章-讨论链路测试
version: "1.0"
description: |
  REG-DISCUSS 回归：Work–Review FAIL → 项目群讨论 → PATCH → PASS。
  材料与成功标准见 第三章-讨论链路测试-goal.txt。
options:
  review_enabled: false
  needs_review_blocks: true
  group_discussion_enabled: true
  loop_discussion_profile: work-review-alignment
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: true
      profile: work-review-alignment
  split_enabled: false
  parallel_enabled: false
  max_parallel: 1
loops:
- id: discuss_test_round
  description: "讨论链路 REG — Work–Review 直到 REVIEW PASS"
  max_rounds: 5
  min_rounds: 1
  default_body: default
  on_pass: complete
  on_exhaust: needs_review
  bodies:
    default:
    - id: work
      name: 编写/修订产品整体规划
      agent: product
      task_type: product-planning
      template_id: tds-ch3-product-planning
      dependencies: []
      description: |
        【REG】第 {round}/{max_rounds} 轮 work（loop: {loop_id}）
        【第 1 轮】按 template 撰写第三章；材料见 goal 文件只读基线
        【第 2+ 轮 · PATCH】仅改群讨论「定点改稿清单」项；基线 {prev_work_task_id} → {work_task_id}
        【产出】{work_task_id}_deliverable.md
    - id: review
      name: 项目经理内容质量评审
      agent: main
      task_type: section-review
      dependencies:
      - work
      description: |
        【对象】{work_task_id}_deliverable.md
        【轮次】第 {round}/{max_rounds} 轮
        【末行 marker】REVIEW: PASS 或 REVIEW: FAIL
        【产出】section-review 交付物
  assess:
    ref: review
  transition:
  - when: deliverable_marker
    task: review
    marker: "REVIEW: PASS"
    action: exit
    outcome: complete
  - when: exhausted
    action: exit
    outcome: needs_review
  fallback_until:
  - type: deliverable_marker
    task: review
    marker: "REVIEW: PASS"
tasks:
- id: t-discuss-reg
  name: 讨论链路 REG（Work-Review 循环）
  loop: discuss_test_round
  dependencies: []
