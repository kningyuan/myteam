id: 媒体持续运营
version: '1.0'
description: |
  媒体持续运营（知乎 MVP）：调研 → 策略 → 内容 → 发布。
  启动时使用 --mode recurring --max-cycles N 实现周期 tick。
options:
  parallel_enabled: false
  review_enabled: false
  group_discussion_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: false
tasks:
  - id: t-research
    name: 选题调研
    agent: research
    task_type: research
    dependencies: []
    description: |
      【对象】目标见【项目目标】
      【视角】热点、竞品、受众；输出选题建议
  - id: t-strategy
    name: 内容策略
    agent: product
    task_type: strategy
    dependencies:
      - t-research
    description: |
      【输入】只读 t-research
      【产出】内容日历与策略要点
  - id: t-content
    name: 内容撰写
    agent: content
    task_type: content
    dependencies:
      - t-strategy
    description: |
      【输入】只读 t-strategy
      【产出】待发布正文（content task_type）
  - id: t-publish
    name: 知乎发布
    agent: social_zhihu
    task_type: publish-post
    dependencies:
      - t-content
    description: |
      【输入】只读 t-content
      【产出】发布记录（URL/截图）；写入 publish_log（若启用）
