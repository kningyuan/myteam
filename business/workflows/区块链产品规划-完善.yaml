id: 区块链产品规划-完善
name: 区块链产品规划-完善
description: 区块链产品规划 Word 文档的迭代完善（方案完善的区块链实例）
version: '1.0'
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: true
      profile: work-review-alignment
tasks:
- id: plan-iterate
  name: 区块链方案迭代完善
  loop: plan_improve_round
  dependencies: []
  description: 每轮：撰写/修订区块链产品规划文档 → main 评审 → 汇总改稿清单
loops:
- id: plan_improve_round
  max_rounds: 3
  min_rounds: 1
  default_body: draft
  on_pass: complete
  on_exhaust: needs_review
  bodies:
    draft:
    - id: work
      name: 撰写区块链规划初稿
      agent_id: product
      task_type: feature-design
      template_id: feature-design
      dependencies: []
      description: '【范围】基于区块链材料撰写产品规划文档初稿

        【输入】项目目标 + 参考稿与模版路径

        【交付】deliverables/work_deliverable.md

        【质量】覆盖需求背景/方案设计/架构图/验收标准四章节'
    - id: assess
      name: 评估初稿
      agent_id: main
      task_type: section-review
      template_id: review-report
      dependencies:
      - work
      description: '【范围】评审初稿，输出 ITERATION: PASS/CONTINUE/STOP'
    revise:
    - id: work
      name: 修订区块链规划
      agent_id: product
      task_type: feature-design
      template_id: feature-design
      dependencies: []
      description: '【范围】根据评审反馈修订，仅修改清单列出的问题'
    - id: assess
      name: 评估修订稿
      agent_id: main
      task_type: section-review
      template_id: review-report
      dependencies:
      - work
      description: '【范围】评估修订稿，输出 ITERATION: PASS/CONTINUE/STOP'
  assess:
    ref: assess
    inputs:
    - kind: goal
    - kind: phase.deliverable
      phase: work
  transition:
  - when: deliverable_marker
    task: assess
    marker: "ITERATION: PASS"
    action: exit
    outcome: complete
  - when: deliverable_marker
    task: assess
    marker: "ITERATION: STOP"
    action: exit
    outcome: needs_review
  - when: deliverable_marker
    task: assess
    marker: "ITERATION: CONTINUE"
    action: continue
    next_body: revise
  - when: exhausted
    action: exit
    outcome: needs_review
  fallback_until:
  - type: deliverable_marker
    task: assess
    marker: "ITERATION: PASS"
