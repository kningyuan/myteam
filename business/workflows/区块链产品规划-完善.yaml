id: 区块链产品规划-完善
name: 迪诺链区块链产品规划
version: "1.0"
description: |
  迪诺链区块链产品规划专项：基于参考稿与 Word 模版，交付完整产品规划（含产品架构图、系统架构图 PPT）。
  材料默认位于 business/inputs/blockchain-dino/；Goal 可覆盖路径。
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: true
      profile: work-review-alignment
tasks:
  - id: task-1
    name: 区块链产品规划循环
    loop: blockchain_plan_round
    dependencies: []
    description: |
      【说明】架构图（PPT）→ 产品规划正文 → 评审；template_id=blockchain-product-planning
loops:
  - id: blockchain_plan_round
    max_rounds: 5
    min_rounds: 1
    default_body: default
    on_pass: complete
    on_exhaust: needs_review
    bodies:
      default:
        - id: step-1
          name: 分层架构图（PPT）
          agent: product
          task_type: deck-build
          template_id: blockchain-product-planning
          dependencies: []
          description: |
            【Skill】deck-build、officecli、product-operations
            【必读】business/inputs/blockchain-dino/架构分层说明.md
            【交付】产品架构图.pptx（四层：基础设施/组件/通用系统/业务平台，一功能一方块）
            【交付】系统架构图.pptx（网关、开放服务、协作链/工作链、节点与链下适配，与产品架构可对齐）
        - id: step-2
          name: 产品规划正文
          agent: product
          task_type: section-authoring
          template_id: blockchain-product-planning
          dependencies:
            - step-1
          description: |
            【Skill】section-authoring、officecli
            【模版】business/inputs/blockchain-dino/产品规划-模版.docx
            【参考】business/inputs/blockchain-dino/区块链-产品规划.docx（保留合理表述，补齐空章节）
            【嵌入】产品架构、系统架构两节须插入 step-1 导出的 PNG 或说明 PPT 路径
            【一致性】产品架构（业务分层）与系统架构（部署/集成）术语与层次须前后一致
        - id: step-3
          name: 规划质量评审
          agent: main
          task_type: section-review
          dependencies:
            - step-2
          description: |
            【Skill】section-review
            【核对】模版章节齐全；两架构图分层清晰、无合并方块；正文与图一致
            【输出】末行 REVIEW: PASS 或 REVIEW: FAIL
    assess:
      ref: step-3
      inputs:
        - kind: goal
        - kind: phase.deliverable
          phase: step-2
    transition:
      - when: deliverable_marker
        task: step-3
        marker: "REVIEW: PASS"
        action: exit
        outcome: complete
      - when: deliverable_marker
        task: step-3
        marker: "REVIEW: FAIL"
        action: continue
        next_body: default
      - when: exhausted
        action: exit
        outcome: needs_review
    fallback_until:
      - type: deliverable_marker
        task: step-3
        marker: "REVIEW: PASS"
