id: 方案编制
version: '1.0'
description: 方案编制全流程：调研 → 需求 → 策略方案 →（可选）技术架构 → 文档定稿 → 验收 → 决策记录；具体课题在 goal 填写
options:
  review_enabled: false
  split_enabled: true
  parallel_enabled: false
  max_parallel: 2
tasks:
- id: t-research
  name: 背景调研
  agent: research
  task_type: research
  dependencies: []
  description: |
    【对象】见【项目目标】
    【产出】行业/竞品/约束证据，附信息来源
- id: t-req
  name: 问题与范围界定
  agent: product
  task_type: requirements
  dependencies:
  - t-research
  description: |
    【Skill】business/skills/product-operations/SKILL.md + requirements/SKILL.md
    【输入】t-research
    【产出】核心问题、范围边界、成功标准、不做清单
- id: t-strategy
  name: 策略方案
  agent: product
  task_type: strategy
  dependencies:
  - t-req
  description: |
    【Skill】business/skills/product-operations/SKILL.md + strategy/SKILL.md
    【输入】t-req、t-research
    【产出】背景/分析/方案/建议（strategy 模板）
- id: t-tech
  name: 技术方案（可选）
  agent: arch
  task_type: system-design
  dependencies:
  - t-strategy
  description: |
    【输入】t-strategy
    【说明】若【项目目标】无技术实现诉求，可输出简短「不适用说明」并引用策略结论
    【产出】技术架构、接口与风险（如有）
- id: t-docs
  name: 方案文档定稿
  agent: docs
  task_type: content
  dependencies:
  - t-strategy
  - t-tech
  description: |
    【输入】t-strategy、t-tech
    【产出】统一目录的完整方案文档，不篡改结论
- id: t-accept
  name: 方案验收
  agent: product
  task_type: acceptance-report
  dependencies:
  - t-docs
  description: |
    【输入】t-req 成功标准、t-docs
    【产出】方案是否满足目标、缺口与建议
- id: t-decision
  name: 决策记录
  agent: main
  task_type: decision-record
  dependencies:
  - t-accept
  description: |
    【输入】只读 t-strategy、t-docs、t-accept
    【产出】最终决策、待办与责任人建议
