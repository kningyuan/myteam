id: 回顾-round
name: 工程回顾（Retro）
version: "1.0"
description: |
  gstack 映射：/retro — 周期总结、贡献与改进项；可对齐 experience ledger。
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: true
      profile: work-review-alignment
tasks:
  - id: task-1
    name: 回顾循环
    loop: retro_round
    dependencies: []
    description: |
      数据分析视角 + 产品验收视角 → 协调者汇总。
loops:
  - id: retro_round
    max_rounds: 1
    min_rounds: 1
    default_body: default
    on_pass: complete
    on_exhaust: needs_review
    bodies:
      default:
        - id: step-metrics
          name: 数据与节奏回顾
          agent: analyst
          task_type: data-analysis
          dependencies: []
          description: |
            【gstack】/retro
            【范围】提交量、质量信号、周期趋势（按 Goal 时间窗）
            【交付】deliverables/retro-metrics.md
        - id: step-shipped
          name: 交付与验收回顾
          agent: product
          task_type: acceptance-report
          dependencies:
            - step-metrics
          description: |
            【范围】本周/本期 shipped 项、未达预期项、用户/业务反馈
            【交付】deliverables/retro-shipped.md
        - id: step-actions
          name: 改进项与决策
          agent: main
          task_type: decision-record
          dependencies:
            - step-shipped
          description: |
            【交付】deliverables/retro-actions.md（可执行改进项 + 负责人建议）
