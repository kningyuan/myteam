id: 知乎运营
version: '1.1'
description: 知乎专栏运营：选题调研 → 成稿 → 真实发布留痕；Skill 见 business/skills/zhihu-operations/
options:
  review_enabled: false
  split_enabled: false
  parallel_enabled: false
  max_parallel: 2
tasks:
- id: t-research
  name: 选题调研
  agent: research
  task_type: research
  dependencies: []
  description: |
    【Skill】business/skills/zhihu-operations/SKILL.md + research/SKILL.md
    【对象】见【项目目标】— 账号领域、选题范围、竞品账号（如有）
    【视角】知乎受众、竞品选题、关键词/GEO 机会
    【产出】按 templates/topic_research_table.md：受众表、竞品表、关键词表、推荐标题方向
    【范围】公开信息；每条数据须标注来源 URL
    【禁止】编造阅读量/粉丝数；禁止本步成稿或发布
- id: t-draft
  name: 知乎成稿
  agent: content
  task_type: content
  dependencies:
  - t-research
  description: |
    【Skill】business/skills/zhihu-operations/SKILL.md + content/SKILL.md
    【输入】t-research 结论与关键词表
    【平台】知乎专栏长文（800 字+，H2 结构）
    【产出】templates/zhihu_article_draft.md 结构；文末 publish_title + 可选 article_body.md
    【须含】关键词研究、目标读者（Gate must_include）
- id: t-publish
  name: 知乎发布
  agent: social_zhihu
  task_type: publish-post
  dependencies:
  - t-draft
  description: |
    【Skill】business/skills/zhihu-operations/SKILL.md + publish-post/SKILL.md
    【输入】t-draft 最终标题与正文
    【须跑】check_zhihu_login.sh → publish_zhihu.sh → verify_publish_deliverable.py
    【须提交】真实 zhuanlan.zhihu.com/p/ URL + evidence/*.png
    【幂等】若 goal 已有 URL 则只补证据，禁止重复发文
    【禁止】编造链接；未登录须 login_zhihu.sh 后重试
