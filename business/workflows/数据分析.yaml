id: 数据分析
version: '1.0'
description: |
  数据分析流水线：需求 → 分析报告 → 脚本 → 验收。
options:
  parallel_enabled: false
  review_enabled: false
tasks:
  - id: t-req
    name: 分析需求
    agent: product
    task_type: requirements
    dependencies: []
    description: |
      【对象】目标见【项目目标】
      【视角】指标口径、分析目标、验收标准
  - id: t-analysis
    name: 数据分析报告
    agent: analyst
    task_type: data-analysis
    dependencies:
      - t-req
    description: |
      【输入】只读 t-req；输出结构化分析报告（按 task_type 章节）
  - id: t-script
    name: 分析脚本
    agent: analyst
    task_type: code-writing
    dependencies:
      - t-analysis
    description: |
      【输入】只读 t-analysis；交付可复用分析脚本/Notebook
  - id: t-accept
    name: 验收
    agent: product
    task_type: acceptance-report
    dependencies:
      - t-script
    description: |
      【输入】只读 t-analysis、t-script；对照 t-req 验收
