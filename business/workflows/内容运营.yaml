id: 内容运营
version: '1.0'
description: 通用内容运营（调研→成稿→发布）。知乎/小红书请优先用「知乎运营」「小红书运营」workflow
options:
  review_enabled: false
  split_enabled: false
  parallel_enabled: false
  max_parallel: 2
tasks:
- id: t-research
  name: 选题调研
  agent: research
  task_type: research
  dependencies: []
  description: '【对象】见【项目目标】'
- id: t-draft
  name: 内容成稿
  agent: content
  task_type: content
  dependencies:
  - t-research
  description: 【输入】t-research；【平台】见【项目目标】
- id: t-publish
  name: 平台发布
  agent: social_zhihu
  task_type: publish-post
  dependencies:
  - t-draft
  description: |
    【输入】t-draft
    【说明】知乎用 social_zhihu；小红书请在 goal 注明并改 workflow 为「小红书运营」
    【须提交】已发布 URL 与截图
