id: 内容运营
version: '1.0'
description: |
  内容持续运营：调研 → 策略 → 内容 → 知乎发布。
options:
  parallel_enabled: false
  review_enabled: false
  split_enabled: false
tasks:
  - id: t-research
    name: 调研
    agent: research
    task_type: research
    dependencies: []
    description: |
      【对象】目标见【项目目标】
      【视角】行业/竞品/受众
  - id: t-strategy
    name: 内容策略
    agent: product
    task_type: strategy
    dependencies:
      - t-research
    description: |
      【输入】只读 t-research；输出内容策略与排期
  - id: t-content
    name: 内容产出
    agent: content
    task_type: content
    dependencies:
      - t-strategy
    description: |
      【输入】只读 t-strategy；按策略撰写正文
  - id: t-publish
    name: 知乎发布
    agent: social_zhihu
    task_type: publish-post
    dependencies:
      - t-content
    description: |
      【输入】只读 t-content；在知乎专栏发布并附 URL/截图证据
