id: 战略对齐-round
name: 战略对齐（Office Hours）
version: "1.0"
description: |
  gstack 映射：/office-hours — 需求与方案对齐（workflow 固化结论；深度讨论在 Hub 群聊/私聊）。
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: true
      profile: work-review-alignment
tasks:
  - id: task-1
    name: 战略对齐循环
    loop: alignment_round
    dependencies: []
    description: |
      协调者框架 → 产品策略 → 决策记录。
loops:
  - id: alignment_round
    max_rounds: 2
    min_rounds: 1
    default_body: default
    on_pass: complete
    on_exhaust: needs_review
    bodies:
      default:
        - id: step-frame
          name: 问题框架
          agent: main
          task_type: strategy
          dependencies: []
          description: |
            【gstack】/office-hours
            【范围】现状、楔子、非目标；不展开实现
            【交付】deliverables/alignment-frame.md
        - id: step-wedge
          name: 策略与楔子
          agent: product
          task_type: strategy
          dependencies:
            - step-frame
          description: |
            【交付】deliverables/alignment-wedge.md
        - id: step-decision
          name: 对齐结论
          agent: main
          task_type: decision-record
          dependencies:
            - step-wedge
          description: |
            【交付】deliverables/alignment-decision.md
