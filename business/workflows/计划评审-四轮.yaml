id: 计划评审-四轮
name: 计划评审（四轮）
version: "1.0"
description: |
  gstack 映射：/autoplan（CEO→Design→Eng→DX 串行，非交互 15 问版）。
  每步独立 agent + 交付物，末步 decision-record 固化结论。
  task_type 暂用现有注册表；后续可拆 plan-ceo-review 等专用工种。
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: false
tasks:
  - id: task-1
    name: 计划评审循环
    loop: plan_review_round
    dependencies: []
    description: |
      四轮评审 + 决策记录；输入为 Goal 中的计划/方案草稿路径。
loops:
  - id: plan_review_round
    max_rounds: 3
    min_rounds: 1
    default_body: default
    on_pass: complete
    on_exhaust: needs_review
    bodies:
      default:
        - id: step-ceo
          name: CEO 视角评审
          agent: main
          task_type: strategy
          dependencies: []
          description: |
            【gstack】plan-ceo-review
            【范围】需求真伪、楔子、范围扩/持/缩建议；不直接改代码
            【输入】Goal；deliverables/ 或 Goal 指定的计划 md
            【交付】deliverables/plan-ceo-review.md
            【质量】含明确裁决：扩范围 / 持范围 / 缩范围 + 理由
        - id: step-design
          name: 设计维度评审
          agent: product
          task_type: section-review
          dependencies:
            - step-ceo
          description: |
            【gstack】plan-design-review
            【范围】信息架构、视觉/交互维度打分（0–10）与「到 10 还差什么」
            【输入】step-ceo 交付物 + 计划正文
            【交付】deliverables/plan-design-review.md
        - id: step-eng
          name: 工程维度评审
          agent: arch
          task_type: architecture-review
          dependencies:
            - step-design
          description: |
            【gstack】plan-eng-review
            【范围】架构、数据流、边界、测试与性能；不展开实现细节
            【输入】前述评审 + 计划正文
            【交付】deliverables/plan-eng-review.md
        - id: step-devex
          name: 开发者体验评审
          agent: qa
          task_type: test-plan
          dependencies:
            - step-eng
          description: |
            【gstack】plan-devex-review（暂用 test-plan 承载 DX 清单）
            【范围】上手路径、文档/API 摩擦、与竞品 DX 对比
            【交付】deliverables/plan-devex-review.md
        - id: step-decision
          name: 决策记录
          agent: main
          task_type: decision-record
          dependencies:
            - step-devex
          description: |
            【范围】汇总四轮结论、未决项、下一版计划修订要点
            【交付】deliverables/decision-record.md
            【质量】可执行、可审计；重大争议标明需大元帅拍板项
