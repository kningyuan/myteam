id: research-report
name: 调研报告撰写
version: "1.0"
description: 多Agent协作完成调研报告：研究员收集信息，产品专家撰写报告
tasks:
  - id: step-collect
    agent_id: research
    task_type: research
    template_id: research-report
    name: 收集调研信息
    description: |
      【范围】围绕指定主题收集信息，整理关键发现；信息不完整时标注缺失，不跳过
      【输入】调研主题
      【交付】信息收集结果（Markdown）
      【质量】覆盖关键信息点，标注来源；至少覆盖3个对比对象
    dependencies: []
  - id: step-report
    agent_id: product
    task_type: product-research
    template_id: product-planning
    name: 撰写调研报告
    description: |
      【范围】基于收集的信息撰写完整调研报告，包含调研目标、市场概况、竞品分析、用户洞察、机会与建议
      【输入】信息收集结果
      【交付】调研报告（Markdown）
      【质量】报告结构完整，逻辑清晰，须包含全部五个章节
    dependencies:
      - step-collect
