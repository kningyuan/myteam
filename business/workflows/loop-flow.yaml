
id: loop-flow
name: 循环联动
version: "1.0"
description: loop→process 注册测试
tasks:
  - id: t1
    name: 调研
    agent: research
    task_type: research
    dependencies: []
    description: 前置调研
  - id: t-loop
    name: 循环节点
    loop: lr
    dependencies: [t1]
loops:
  - id: lr
    max_rounds: 2
    until:
      - type: deliverable_marker
        task: review
        marker: REVIEW: PASS
    body:
      - id: work
        agent: research
        task_type: research
        dependencies: []
      - id: review
        agent: research
        task_type: research
        dependencies: [work]
