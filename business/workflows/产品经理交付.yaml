id: 产品经理交付
version: '1.0'
description: |
  产品经理 Skill 包：方案 → 需求 → 演示文稿。
options:
  parallel_enabled: false
  review_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: false
tasks:
  - id: t-plan
    name: 产品方案
    agent: product
    task_type: product-planning
    dependencies: []
    description: |
      【对象】目标见【项目目标】
      【产出】产品规划方案（product-planning）
  - id: t-req
    name: 需求说明
    agent: product
    task_type: requirements
    template_id: prd-lite
    dependencies:
      - t-plan
    description: |
      【输入】只读 t-plan
      【产出】结构化需求文档
  - id: t-deck
    name: 演示文稿
    agent: product
    task_type: deck-build
    dependencies:
      - t-req
    description: |
      【输入】只读 t-plan、t-req
      【产出】PPT 大纲与 slide 内容（deck-build）；可配合 wps-deck skill
