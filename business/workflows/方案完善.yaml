id: 方案完善
name: 方案完善
version: "1.0"
description: |
  通用方案/产品规划文档完善：架构图制作 → 章节编制 → 质量评审（Work–Review 循环）。
  具体文档对象、模版路径与只读材料在发起项目时的【项目目标】中指定。
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: true
      profile: work-review-alignment
tasks:
  - id: task-1
    name: 方案完善循环
    loop: plan_improve_round
    dependencies: []
    description: |
      【说明】多轮 plan_improve_round 循环；每轮 step-1 架构图 → step-2 方案编制 → step-3 评审。
loops:
  - id: plan_improve_round
    max_rounds: 5
    min_rounds: 1
    default_body: default
    on_pass: complete
    on_exhaust: needs_review
    bodies:
      default:
        - id: step-1
          name: 架构图制作
          agent: product
          task_type: deck-build
          dependencies: []
          description: |
            【Skill】deck-build → business/skills/deck-build/SKILL.md、officecli
            【对象】Goal 指定的产品架构图、系统架构图（建议 PPT，分层、一功能一方块）
            【交付】deliverables/产品架构图.pptx、deliverables/系统架构图.pptx 及 deck 交付 Markdown
        - id: step-2
          name: 方案编制
          agent: product
          task_type: section-authoring
          dependencies:
            - step-1
          description: |
            【Skill】section-authoring → product-methodology、officecli
            【输入】只读参考稿、模版路径（见【项目目标】）；架构图见 step-1 交付物
            【交付】完整方案正文 Markdown；Word 成品路径写入「产出文件」节
        - id: step-3
          name: 质量评审
          agent: main
          task_type: section-review
          dependencies:
            - step-2
          description: |
            【Skill】section-review
            【输入】step-2 交付物 + Goal；核对架构图与正文一致性
            【输出】评审报告；末行必须为 REVIEW: PASS 或 REVIEW: FAIL
    assess:
      ref: step-3
      inputs:
        - kind: goal
        - kind: phase.deliverable
          phase: step-2
    transition:
      - when: deliverable_marker
        task: step-3
        marker: "REVIEW: PASS"
        action: exit
        outcome: complete
      - when: deliverable_marker
        task: step-3
        marker: "REVIEW: FAIL"
        action: continue
        next_body: default
      - when: exhausted
        action: exit
        outcome: needs_review
    fallback_until:
      - type: deliverable_marker
        task: step-3
        marker: "REVIEW: PASS"
