id: info-report
name: 信息收集与报告
version: "1.0"
description: 收集信息后撰写报告，适用于通用调研场景
tasks:
  - id: step-collect
    agent_id: research
    task_type: research
    template_id: research-report
    name: 收集信息
    description: |
      【范围】围绕指定主题收集相关信息，涵盖市场、用户、竞品等维度
      【输入】调研主题
      【交付】信息汇总（Markdown）
      【质量】信息来源须标注来源；缺失信息明确标注
    dependencies: []
  - id: step-report
    agent_id: product
    task_type: product-planning
    template_id: product-planning
    name: 撰写报告
    description: |
      【范围】基于收集的信息，撰写完整报告
      【输入】信息汇总
      【交付】最终报告（Markdown）
      【质量】报告须包含背景、核心发现、结论与建议
    dependencies:
      - step-collect