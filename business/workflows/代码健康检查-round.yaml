name: 代码健康检查（Code Audit）
version: '2.0'
description: 'gstack 映射：/health 的分步代码健康检查工作流。

  每步聚焦单一检测工具：tsc → eslint → 汇总评分。'
options:
  review_enabled: false
  split_enabled: false
  parallel_enabled: false
  max_parallel: 3
tasks:
- id: task-1
  name: 代码健康检查
  dependencies: []
  description: '分步检测：developer 跑 tsc，frontend 跑 eslint，main 汇总评分。

    '
  loop: code_audit_round
id: 代码健康检查-round
loops:
- id: code_audit_round
  max_rounds: 2
  min_rounds: 1
  default_body: default
  on_pass: complete
  on_exhaust: needs_review
  bodies:
    default:
    - id: step-1
      name: TypeScript 编译检查
      agent: developer
      task_type: code-audit
      dependencies: []
      description: '【gstack】/health → tsc

        【范围】仅检查 TypeScript 编译，不修文件

        【操作】cd frontend-v2 && npx tsc --noEmit

        【交付】deliverables/tsc-check.md

        【格式】记下 exit code 和错误数

        '
    - id: step-2
      name: ESLint 代码质量
      agent: frontend
      task_type: code-review
      dependencies: []
      description: '【gstack】/health → eslint

        【范围】仅运行 ESLint 检查，不修文件

        【操作】cd frontend-v2 && npx eslint --no-error-on-unmatched-pattern .

        【交付】deliverables/eslint-report.md

        【格式】记下错误数和警告数

        '
    - id: step-3
      name: Python 测试
      agent: qa
      task_type: code-testing
      dependencies: []
      description: '【gstack】/health → pytest

        【范围】运行 Python 测试，不修代码

        【操作】PYTHONPATH=backend venv/bin/python3 -m pytest backend/common/tests/ -q
        --tb=no

        【交付】deliverables/pytest-report.md

        【格式】记下通过数和失败数

        '
    - id: step-4
      name: 汇总评分
      agent: main
      task_type: decision-record
      dependencies:
      - step-1
      - step-2
      - step-3
      description: '【gstack】/health → 评分仪表盘

        【输入】step-tsc / step-lint / step-test 的交付物

        【交付】deliverables/code-health-report.md

        【质量】包含各维度评分、综合得分、改进建议，末行 AUDIT: PASS 或 AUDIT: FAIL

        '
  assess:
    ref: step-4
    inputs:
    - kind: goal
    - kind: phase.deliverable
      phase: step-tsc
    - kind: phase.deliverable
      phase: step-lint
    - kind: phase.deliverable
      phase: step-test
  transition:
  - when: deliverable_marker
    task: step-4
    marker: 'AUDIT: PASS'
    action: exit
    outcome: complete
  - when: deliverable_marker
    task: step-4
    marker: 'AUDIT: FAIL'
    action: continue
    next_body: default
  - when: exhausted
    action: exit
    outcome: needs_review
  fallback_until: []
