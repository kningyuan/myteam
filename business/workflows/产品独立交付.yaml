id: 产品独立交付
version: '1.2'
description: 产品专家一人闭环：产品调研 → PRD → 策略 → 演示文稿 → 验收 → 决策
options:
  review_enabled: false
  split_enabled: false
  parallel_enabled: false
  max_parallel: 1
tasks:
- id: t-brief
  name: 背景调研
  agent: product
  task_type: product-research
  dependencies: []
  description: |
    【对象】见【项目目标】
    【视角】产品 — 用户、竞品、机会与约束
    【范围】公开材料 only；1000–1500 字
    【产出】产品向调研报告
- id: t-req
  name: PRD 与验收标准
  agent: product
  task_type: requirements
  dependencies:
  - t-brief
  description: |
    【输入】t-brief
    【产出】In/Out Scope、用户故事、R1/Rn 验收标准
- id: t-strategy
  name: 策略方案
  agent: product
  task_type: strategy
  dependencies:
  - t-req
  description: |
    【输入】t-brief、t-req
    【产出】背景/分析/方案/建议；文末附「演示要点」供 PPT
- id: t-deck
  name: 演示文稿
  agent: product
  task_type: deck-build
  dependencies:
  - t-strategy
  description: |
    【输入】t-strategy 演示要点
    【产出】deck_brief.yaml、deck.pptx、交付记录 Markdown
- id: t-accept
  name: 方案验收
  agent: product
  task_type: acceptance-report
  dependencies:
  - t-req
  - t-deck
  description: |
    【输入】t-req 的 R 验收、t-deck 产出
    【产出】逐项 PASS/FAIL、发布/迭代建议
- id: t-decision
  name: 决策记录
  agent: product
  task_type: decision-record
  dependencies:
  - t-accept
  description: |
    【输入】t-strategy、t-accept
    【产出】阶段结论、待办；独立项目由 product 兼决策
