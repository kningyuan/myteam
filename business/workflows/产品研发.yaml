id: 产品研发
version: '1.0'
description: |
  完整产品研发链：需求 → 架构评审（大需求）→ 实现 → 测试 → 验收。
  arch 节点可按 Goal 规模在 Hub 启动前裁剪（小需求可跳过 t-arch）。
options:
  parallel_enabled: false
  review_enabled: false
  # Gate 已通过即可下游；自评 needs_review 不阻塞（OpenCode 试跑友好）
  needs_review_blocks: false
tasks:
  - id: t-req
    name: 产品需求
    agent: product
    task_type: requirements
    dependencies: []
    description: |
      【对象】目标见【项目目标】
      【产出】可验收 PRD（requirements task_type）
  - id: t-arch
    name: 架构评审
    agent: arch
    task_type: architecture-review
    dependencies:
      - t-req
    description: |
      【输入】只读 t-req 交付物
      【产出】架构评审报告；大改动须列风险与接口边界
  - id: t-dev
    name: 研发实现
    agent: developer
    task_type: code-writing
    dependencies:
      - t-arch
    description: |
      【输入】只读 t-req、t-arch
      【产出】可运行代码交付物（code-writing）
  - id: t-test
    name: 测试
    agent: qa
    task_type: code-testing
    dependencies:
      - t-dev
    description: |
      【输入】只读 t-dev
      【产出】测试报告与用例说明
  - id: t-acc
    name: 验收
    agent: product
    task_type: acceptance-report
    dependencies:
      - t-test
    description: |
      【输入】只读 t-req、t-test
      【产出】验收报告对照 PRD
