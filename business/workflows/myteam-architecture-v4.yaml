id: myteam-architecture-v4
version: '4.0'
extends: myteam-platform-v3
description: |
  myteam 架构边界改进 track（v4，**扩展** v3，不替换 v3）。
  聚焦：模块边界审计、StoreBackend 端口、Hub API Wave 3–5 提取、
  前端 api 层拆分与 Port 接口、前后端 REST 契约对齐测试、架构闸门。
  v3 继续负责平台能力（token/PG/v2 迁移/E2E）；v4 仅负责 FE/BE 边界与端口化。
  诊断基线：docs/assessments/architecture-v4-diagnosis.md
  边界 SSOT：docs/plans/frontend-backend-boundary.md
options:
  parallel_enabled: true
  max_parallel: 2
  review_enabled: false
  needs_review_blocks: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: false
roster:
  - main
  - arch
  - developer
  - qa
phases:
  - id: A1
    name: 边界诊断
    gate_ref: docs/assessments/architecture-v4-diagnosis.md
  - id: A2
    name: 后端端口
    gate_ref: docs/plans/api-split-plan.md
  - id: A3
    name: 前端端口
    gate_ref: docs/plans/frontend-backend-boundary.md#frontend-api-layer
  - id: A4
    name: 契约集成
    gate_ref: docs/plans/frontend-backend-boundary.md#contract-tests
  - id: A5
    name: 架构闸门
    gate_ref: docs/assessments/architecture-v4-gate-record.md
tasks:
  # ── A1 边界诊断 ─────────────────────────────────────────
  - id: arch-audit
    phase: A1
    name: A1 模块边界审计
    agent: arch
    task_type: architecture-review
    dependencies: []
    description: |
      【对象】Hub API、Store、adapter、frontend-v2 api 层的当前模块边界与耦合热点。
      【动作】只读扫描（wc、rg imports、路由计数、fetch 分布）；不修改代码。
      【输入】backend/hub/api/server.py、frontend-v2/src/lib/api*、backend/common/store.py、
              backend/adapters/*、docs/plans/api-split-plan.md（Wave 状态）。
      【产出】docs/assessments/architecture-v4-diagnosis.md（含量化指标表 + 耦合热点 + Wave 差距）。
      【必含指标】server.py 行数、api.ts 行数、Hub 路由分布（server vs routes/）、
                  StoreBackend 存在性、adapter 文件数、frontend fetch 层外调用数、
                  pages/components 直写 /api/ 路径数（目标 0）。
      【下游】backend-ports、frontend-ports、integration-test 均以本文件为基线。

  # ── A2 后端端口 ─────────────────────────────────────────
  - id: backend-ports
    phase: A2
    name: A2 后端端口化（StoreBackend + API Wave 3–5）
    agent: developer
    task_type: code-deliverable
    dependencies:
      - arch-audit
    description: |
      【StoreBackend】从 backend/common/store.py 提取 StoreBackend Protocol（或 ABC）；
      SqliteStoreBackend 为默认实现；Store 类变为薄门面委托（见 pg-migration-plan §3）。
      【API Wave 3–5】按 docs/plans/api-split-plan.md 剩余 waves 提取路由：
        - Wave 3：agents/backends/config 域 → routes/agents.py、routes/backends.py、routes/config.py
        - Wave 4：chat/groups → routes/chat.py、routes/groups.py
        - Wave 5：projects/workflows/task-types/delivery-templates 完整提取；kernel 启动保留 server 或 hub/lifecycle.py
      【目标】server.py < 400 行（仅 app 装配、lifespan、middleware、静态/SPA fallback）。
      【共享层】hub/api/deps.py、errors.py 不变；禁止 routes ↔ server 循环导入。
      【产出】backend 变更 + docs/executions/architecture-v4-backend-change-log.md
      【测试】pytest backend/common/tests -q 0 failed；test_projects_api.py 等路由测试通过。

  # ── A3 前端端口 ─────────────────────────────────────────
  - id: frontend-ports
    phase: A3
    name: A3 前端 API 拆分与 Port 接口
    agent: developer
    task_type: code-deliverable
    dependencies:
      - arch-audit
    description: |
      【api 拆分】完成 frontend-v2/src/lib/api/ 域模块迁移，api.ts 仅保留 barrel re-export（或删除）：
        - client.ts — hubFetch / SSE 传输（Port 层，无业务路径硬编码在 pages）
        - projects.ts、agents.ts、chat.ts、groups.ts、workflows.ts、config.ts — 域 Port
        - index.ts — 统一导出
      【Port 接口】每个域模块导出 typed 函数；禁止 pages/components 直接 fetch 或写 /api/ 字符串。
      【迁移】30+ 处仍 import @/lib/api barrel 的 pages/components 逐步切至域模块或 index。
      【目标】api.ts 单行数 < 50（纯 re-export）；lib/api/*.ts 合计承载全部 REST 路径。
      【产出】frontend-v2 变更 + docs/executions/architecture-v4-frontend-change-log.md
      【参照】docs/plans/frontend-backend-boundary.md#frontend-api-layer

  # ── A4 契约集成 ─────────────────────────────────────────
  - id: integration-test
    phase: A4
    name: A4 前后端 REST 契约集成测试
    agent: qa
    task_type: code-testing
    dependencies:
      - backend-ports
      - frontend-ports
    description: |
      【目标】frontend lib/api 中声明的 REST 路径与方法，与 Hub 注册路由一一匹配（无 404 漂移）。
      【实现】扩展 backend/common/tests/test_api_contract.py 或新增 test_fe_hub_route_parity.py：
        1. 静态解析 frontend-v2/src/lib/api/*.ts 中的 hubFetch/EventSource 路径模板
        2.  introspect FastAPI app.routes（或维护 docs/HUB_API_CONTRACT.md 机器可读清单）
        3. 断言：每个 FE 消费路径在 Hub 存在且 HTTP method 一致
      【形状测试】保留现有 OVERVIEW_KEYS、groups last_message_at 等响应形状断言。
      【SSOT】docs/HUB_API_CONTRACT.md + docs/plans/frontend-backend-boundary.md；
              OpenAPI 生成列为可选 future（本任务不阻塞）。
      【产出】pytest 模块 + docs/executions/architecture-v4-contract-test-report.md
      【Gate 输入】parity 测试 100% pass；新增端点须同时更新契约 doc + 测试。

  # ── A5 架构闸门 ─────────────────────────────────────────
  - id: arch-gate
    phase: A5
    name: A5 架构边界闸门
    agent: main
    task_type: decision-record
    dependencies:
      - arch-audit
      - backend-ports
      - frontend-ports
      - integration-test
    description: |
      【v4 Gate】逐项 PASS/FAIL + 证据链接；FAIL 不视为 v4 track 完成。
      【必检项】
        1. server.py < 400 行
        2. StoreBackend Protocol 存在且 Store 委托实现
        3. API Wave 3–5 路由已提取（server 遗留路由清单为空或仅 SPA/health）
        4. frontend pages/components 零 fetch、零 /api/ 字符串
        5. api.ts 仅 barrel（< 50 行）或已删除
        6. FE↔Hub route parity 测试 100% pass
        7. pytest backend -q 0 failed
      【禁止】frontend import backend 路径；backend import frontend 源码（见 boundary plan）
      【产出】docs/assessments/architecture-v4-gate-record.md
      【关系】v3 P4 可并行；v4 PASS 不替代 v3 final-gate，二者独立签发。
