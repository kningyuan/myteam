id: 问题调查-round
name: 问题调查（根因分析）
version: "1.0"
description: |
  gstack 映射：/investigate — 四阶段：调查→分析→假设→修复（Iron Law：无根因不修）。
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: false
tasks:
  - id: task-1
    name: 调查循环
    loop: investigate_round
    dependencies: []
    description: |
      调查与根因文档 → 条件修复 → 决策记录。
loops:
  - id: investigate_round
    max_rounds: 3
    min_rounds: 1
    default_body: default
    on_pass: complete
    on_exhaust: needs_review
    bodies:
      default:
        - id: step-investigate
          name: 调查与根因
          agent: developer
          task_type: research
          dependencies: []
          description: |
            【gstack】/investigate
            【Skill】后续 investigate-methodology
            【范围】复现、日志、时间线；禁止无证据的修复
            【交付】deliverables/investigate-rca.md（含根因陈述与证据链）
        - id: step-fix
          name: 根因修复
          agent: developer
          task_type: code-writing
          dependencies:
            - step-investigate
          description: |
            【范围】仅针对已记录根因的最小修复 + 回归说明
            【交付】代码变更 + deliverables/investigate-fix.md
        - id: step-record
          name: 调查结论记录
          agent: main
          task_type: decision-record
          dependencies:
            - step-fix
          description: |
            【交付】deliverables/investigate-decision.md（预防复发项）
