# Prompt 矩阵冒烟：多 agent × 多 task_type，description 仅变量部分
id: prompt-matrix-smoke
version: "1.1"
description: 验证 prompt_templates.yaml（与 agent 解耦）

roster:
  required: [main, product, research, content]

options:
  review_enabled: false
  split_enabled: false
  parallel_enabled: true
  max_parallel: 3

tasks:
  - id: t-product
    name: 产品调研
    agent: product
    task_type: research
    dependencies: []
    description: |
      【对象】https://github.com/iOfficeAI/AionUi
      【视角】产品：定位、用户、场景、与同类差异

  - id: t-arch
    name: 架构调研
    agent: research
    task_type: research
    dependencies: []
    description: |
      【对象】https://github.com/iOfficeAI/AionUi
      【视角】架构：技术栈、模块、CLI/Agent 集成

  - id: t-content
    name: 读者视角摘要
    agent: content
    task_type: content
    dependencies: []
    description: |
      【对象】https://github.com/iOfficeAI/AionUi
      【视角】潜在用户：读完 README 后最关心的 3 个问题与答案（短文）

  - id: t-summary
    name: 综合报告
    agent: main
    task_type: strategy
    dependencies: [t-product, t-arch, t-content]
    description: |
      【输入】只读 t-product、t-arch、t-content 三份交付物
