id: myteam-platform-v3
version: '3.0'
description: |
  myteam 平台架构改进 Workflow v3（圆桌修正项 1–7 已纳入）。
  P1 诊断 → P2 方案 → P3 执行（并行扇出）→ P4 验收。
  权威修正来源：docs/assessments/roundtable-继续-1781388407652438.md
  量化 Gate：docs/assessments/platform-v3-gates.md（参照 FRAMEWORK-FREEZE.md）
options:
  parallel_enabled: true
  max_parallel: 4
  review_enabled: false
  needs_review_blocks: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: false
roster:
  - main
  - arch
  - product
  - research
  - developer
  - qa
  - ops
phases:
  - id: P1
    name: 诊断
    gate_ref: docs/assessments/platform-v3-gates.md#p1-gate
  - id: P2
    name: 方案
    gate_ref: docs/assessments/platform-v3-gates.md#p2-gate
  - id: P3
    name: 执行
    gate_ref: docs/assessments/platform-v3-gates.md#p3-gate
  - id: P4
    name: 验收
    gate_ref: docs/assessments/platform-v3-gates.md#p4-gate
tasks:
  # ── P1 诊断 ─────────────────────────────────────────────
  - id: p1-1-audit-matrix
    phase: P1
    name: P1.1 v1/v2 功能对比矩阵
    agent: product
    task_type: requirements
    dependencies: []
    description: |
      【修正项 5 前提】P1.1 矩阵是 P3.2 轻量确认与 P4 完整验收的输入真源。
      【对象】Hub v1 vs frontend-v2 功能域；按 P0/P1/P2 任务链标注完整度。
      【产出】docs/assessments/v1-v2-feature-matrix.md
      【Gate 输入】P0 链路逐条可核对；每条含：功能域、v1 状态、v2 状态、差距、优先级。
      【禁止】标注"已完成"除非有页面/API 证据路径。

  - id: p1-2-six-dim-report
    phase: P1
    name: P1.2 六维架构诊断报告
    agent: arch
    task_type: architecture-review
    dependencies: []
    description: |
      【对象】圆桌六维：通信层韧性、路由模块化、前端功能完整度、部署确定性、成本可观测性、行业差异化。
      【产出】docs/assessments/six-dimension-diagnosis.md
      【输入】只读 FRAMEWORK-FREEZE.md、docs/ARCHITECTURE.md、backend/hub/api/server.py 规模证据。
      【Gate 输入】六维均有现状描述 + 差距 + 改进方向（不要求 P2 方案细节）。

  - id: p1-3-sqlite-audit
    phase: P1
    name: P1.3 SQLite / Store 现状审计
    agent: ops
    task_type: research
    dependencies: []
    description: |
      【修正项 3 输入】为 2.5 直写清单与 2.4 PG 迁移提供基线；引用 store.py WAL 与 state.db 实证。
      【对象】business/tasks/state.db；Store 类写路径 vs group_manager 直写 bypass。
      【产出】docs/assessments/sqlite-store-audit.md
      【必含】文件大小、PRAGMA journal_mode、Hub 读 + kernel 写并发模式、直写 bypass 样例路径。
      【Gate 输入】PG 迁移产品价值前提（单用户 vs 多实例）有明确结论。

  - id: p1-4-competitor-baseline
    phase: P1
    name: P1.4 竞品基线（产品定位参考）
    agent: research
    task_type: research
    dependencies:
      - p1-1-audit-matrix
    description: |
      【修正项 4】P1 末尾产出；标注「产品定位参考，非技术方案依赖」；不阻塞 P2 技术任务启动。
      【对象】CrewAI、LangGraph、AutoGPT（≥3 竞品，≥5 维度，量化数据 + 引用来源）。
      【产出】填充 docs/assessments/competitor-baseline.md（替换 TBD 占位）。
      【Gate】见 platform-v3-gates.md#p1-gate 竞品子项。

  - id: p1-5-e2e-baseline
    phase: P1
    name: P1.5 编排内核 E2E 基线测试
    agent: qa
    task_type: test-plan
    dependencies:
      - p1-2-six-dim-report
    description: |
      【修正项 1】P1 末尾必须产出 ≥1 条编排内核完整链路 E2E，且「可执行两次」。
      【范围】Process → AgentPort → Gate → Store 核心路径（非聊天/群讨论独立路径）。
      【产出】scripts/regression/reg_platform_v3_e2e_baseline.py（或等价 pytest 模块）+ 运行说明。
      【Gate】测试通过率 100%；改造前基线跑 1 次 + 同命令再跑 1 次，结果一致。
      【参照】FRAMEWORK-FREEZE.md §6 tier_e2e / pytest backend -q。

  - id: p1-gate
    phase: P1
    name: P1 阶段闸门
    agent: main
    task_type: decision-record
    dependencies:
      - p1-1-audit-matrix
      - p1-2-six-dim-report
      - p1-3-sqlite-audit
      - p1-4-competitor-baseline
      - p1-5-e2e-baseline
    description: |
      【修正项 7 · P1 Gate】P0 链路功能完整度 = 100%（矩阵证据）；E2E 基线双跑一致；竞品基线达标。
      【输入】P1.1–P1.5 全部交付物 + platform-v3-gates.md#p1-gate 逐项勾选。
      【产出】docs/assessments/p1-gate-record.md（PASS/FAIL + 证据链接）。
      【FAIL】不得进入 P2。

  # ── P2 方案（部分并行）──────────────────────────────────
  - id: p2-1-api-split-plan
    phase: P2
    name: P2.1 API 拆分方案
    agent: arch
    task_type: system-design
    dependencies:
      - p1-gate
    description: |
      【对象】backend/hub/api/server.py 按业务域拆分（目标模块边界图）。
      【产出】docs/plans/api-split-plan.md + 路由边界图（Mermaid 或表格）。
      【下游】2.3a 接口契约须引用本方案路由边界图（修正项 3）。
      【方案要素】目标状态、当前差距、实施步骤、验收指标、风险评估（修正项 7 · P2 Gate）。

  - id: p2-5-group-direct-write
    phase: P2
    name: P2.5 group_manager 直写收拢方案
    agent: arch
    task_type: architecture-review
    dependencies:
      - p1-gate
      - p1-3-sqlite-audit
    description: |
      【修正项 3】产出「直写清单」作为 2.4 PG 迁移方案输入。
      【对象】backend/base/group_manager.py 等 bypass Store 的 _conn.execute 路径。
      【产出】docs/plans/group-manager-direct-write-inventory.md
      【Gate 输入】每条直写含：文件路径、表/操作、收拢至 Store 的建议 API。

  - id: p2-2-v2-migration-plan
    phase: P2
    name: P2.2 v2 功能迁移方案
    agent: product
    task_type: product-planning
    dependencies:
      - p2-1-api-split-plan
      - p1-1-audit-matrix
    description: |
      【依赖】v2 对齐 API 边界（2.1）；补齐范围来自 P1.1 矩阵 P0 链路。
      【产出】docs/plans/v2-migration-plan.md
      【方案要素】目标状态、当前差距、实施步骤、验收指标、风险评估、人天估算（建议项）。
      【修正项 2 预告】token 验收采用功能性三步，不用覆盖率百分比。

  - id: p2-3a-store-token-contract
    phase: P2
    name: P2.3a Store token 计量抽象契约
    agent: arch
    task_type: system-design
    dependencies:
      - p2-1-api-split-plan
    description: |
      【修正项 3 · 先契约后实施】在 Store 层定义 token 计量抽象接口（如 record_token_usage）。
      【输入】2.1 路由边界图 + contracts.py Meta.tokens 字段现状。
      【产出】docs/plans/store-token-metering-contract.md
      【下游】2.3b（adapter 采集）与 2.4（PG 迁移）可并行，共享本契约。

  - id: p2-3b-token-adapter-plan
    phase: P2
    name: P2.3b adapter token 采集方案
    agent: developer
    task_type: system-design
    dependencies:
      - p2-3a-store-token-contract
    description: |
      【修正项 2】验收标准为功能性三步：adapter 能提取 → API 能返回 → 前端能展示。
      【产出】docs/plans/token-adapter-plan.md
      【Gate 指标】各 CLI adapter 的 token 数据在 SSE 事件中可验证（非 ≥80% 覆盖率）。
      【方案要素】目标状态、当前差距、实施步骤、验收指标、风险评估、人天估算。

  - id: p2-4-pg-migration-plan
    phase: P2
    name: P2.4 SQLite→PG 迁移方案
    agent: ops
    task_type: architecture-review
    dependencies:
      - p2-3a-store-token-contract
      - p2-5-group-direct-write
    description: |
      【修正项 3】依赖 2.3a 接口稳定 + 2.5 直写清单；与 2.3b 并行（不串行等待 2.3b 完成）。
      【输入】P1.3 审计结论 + 2.5 直写清单。
      【产出】docs/plans/pg-migration-plan.md
      【方案要素】目标状态、当前差距、实施步骤、验收指标、风险评估、人天估算。
      【约束】Store 对外接口向后兼容；不破坏 FRAMEWORK-FREEZE 内核语义。

  - id: p2-gate
    phase: P2
    name: P2 阶段闸门
    agent: main
    task_type: decision-record
    dependencies:
      - p2-1-api-split-plan
      - p2-2-v2-migration-plan
      - p2-3a-store-token-contract
      - p2-3b-token-adapter-plan
      - p2-4-pg-migration-plan
      - p2-5-group-direct-write
    description: |
      【修正项 7 · P2 Gate】每个方案交付物含：目标状态、当前差距、实施步骤、验收指标、风险评估。
      【产出】docs/assessments/p2-gate-record.md
      【FAIL】不得进入 P3 执行。

  # ── P3 执行（stub · 并行扇出）────────────────────────────
  - id: p3-1-api-split-exec
    phase: P3
    name: P3.1 API 拆分实施（stub）
    agent: developer
    task_type: code-deliverable
    dependencies:
      - p2-gate
      - p2-1-api-split-plan
    description: |
      【执行 stub】按 P2.1 方案实施 API 域拆分；本 workflow 仅定义交付边界，不预设已完成。
      【修正项 6 · 附带修复】同 PR 须修复 _KERNEL_RUNS：
        - 从 server.py 提取至 hub/kernel_run.py
        - 持久化从 project.meta 改为 Store 独立表行
        - 产出 docs/executions/kernel-runs-change-log.md
      【Gate 子项】_KERNEL_RUNS 修复验证通过（Hub 重启无 ghost running=true）。
      【产出】backend/hub/api/*.py 变更 + docs/executions/api-split-change-log.md

  - id: p3-2-v2-feature-exec
    phase: P3
    name: P3.2 v2 功能补齐实施（stub）
    agent: developer
    task_type: code-deliverable
    dependencies:
      - p2-gate
      - p2-2-v2-migration-plan
    description: |
      【执行 stub】按 P2.2 与 P1.1 矩阵补齐 P0 链路 frontend-v2 功能；不预设已完成。
      【说明】v3 roster 无 @frontend，由 @developer 交付 stub/协调说明；实际 UI 可另开 frontend 任务。
      【产出】frontend-v2 变更说明 + docs/executions/v2-feature-list.md

  - id: p3-2-product-light
    phase: P3
    name: P3.2b 产品轻量确认（功能存在）
    agent: product
    task_type: section-review
    dependencies:
      - p3-2-v2-feature-exec
    description: |
      【修正项 5 · 轻量确认】仅确认「功能存在」，非「功能可用」；不阻塞 P3 其他并行任务。
      【动作】在 P1.1 矩阵上标注 P0 项「已补齐」+ 证据路径；禁止全文重写矩阵。
      【产出】docs/executions/p3-2-product-light-confirm.md
      【非 Gate 阻塞】下游 P3.3/P3.4 不依赖本任务。

  - id: p3-3-token-metering-exec
    phase: P3
    name: P3.3 token 计量实施（stub）
    agent: developer
    task_type: code-deliverable
    dependencies:
      - p2-gate
      - p2-3b-token-adapter-plan
      - p2-3a-store-token-contract
    description: |
      【执行 stub】按 2.3a 契约 + 2.3b 方案实现 adapter 采集与 Store 写入。
      【修正项 2 · 功能性验收】adapter 提取 → API 返回 → 前端展示（SSE 事件可验证 token 字段）。
      【产出】backend/adapter/ + store 变更 + docs/executions/token-metering-change-log.md

  - id: p3-4-pg-migration-exec
    phase: P3
    name: P3.4 PG 迁移实施（stub）
    agent: developer
    task_type: code-deliverable
    dependencies:
      - p2-gate
      - p2-4-pg-migration-plan
      - p2-5-group-direct-write
    description: |
      【执行 stub】按 P2.4 在测试环境验证 Store→PG；生产切换需 @ops 签字（见 P4）。
      【输入】2.5 直写清单收拢完成后方可切主库。
      【产出】backend/common/store.py 迁移层 + docs/executions/pg-migration-change-log.md
      【协作】@ops 负责环境/回滚预案文档，不阻塞 developer stub 启动。

  - id: p3-5-regression
    phase: P3
    name: P3.5 回归测试（含 E2E 扩展）
    agent: qa
    task_type: code-testing
    dependencies:
      - p3-1-api-split-exec
      - p3-2-v2-feature-exec
      - p3-3-token-metering-exec
      - p3-4-pg-migration-exec
    description: |
      【修正项 7 · P3 Gate】E2E 覆盖 ≥3 条关键路径，通过率 100%。
      【输入】P1.5 基线脚本 + P3 各 change-log；须含 P1.5 双跑回归。
      【产出】docs/executions/p3-regression-report.md + pytest/reg 运行证据。
      【参照】FRAMEWORK-FREEZE.md：pytest backend -q 0 failed。

  # ── P4 验收 ─────────────────────────────────────────────
  - id: p4-product-acceptance
    phase: P4
    name: P4 产品完整验收
    agent: product
    task_type: acceptance-report
    dependencies:
      - p3-5-regression
      - p3-2-product-light
    description: |
      【修正项 5 · 完整验收】确认「功能可用」+「核心旅程可完成」（相对 P3.2b 的「功能存在」）。
      【输入】P1.1 矩阵（含 P3.2b 标注）+ P3.5 回归报告 + 各 execution change-log。
      【产出】docs/reports/platform-v3-product-acceptance.md
      【Gate】见 platform-v3-gates.md#p4-gate（逐项清单，无循环引用）。

  - id: p4-ops-verify
    phase: P4
    name: P4 运维上线验证
    agent: ops
    task_type: research
    dependencies:
      - p3-5-regression
      - p3-4-pg-migration-exec
    description: |
      【对象】PG 迁移（若启用）、Hub 健康检查、回滚预案可执行性。
      【产出】docs/reports/platform-v3-ops-verify.md
      【必含】curl 健康检查、state.db/PG 连接证据、回滚步骤 dry-run 记录。

  - id: p4-final-gate
    phase: P4
    name: P4 总验收闸门
    agent: main
    task_type: decision-record
    dependencies:
      - p4-product-acceptance
      - p4-ops-verify
    description: |
      【修正项 7 · P4 Gate】逐项列出验收清单（矩阵 P0=100%、API 拆分、token 功能性三步、
      _KERNEL_RUNS 修复、E2E≥3 路径 100%、竞品基线已归档）；禁止「所有 Gate 条件满足」循环引用。
      【产出】docs/reports/platform-v3-final-gate.md（PASS/FAIL + 遗留项）。
      【签发】仅 PASS 后视为 v3 workflow 完成。
