# 冒烟测试：1 个 research + 1 个汇总（验证交付物保证层）
id: smoke-research
version: "1.0"
description: 最小团队协作冒烟 — 单调研 + main 汇总

roster:
  required: [main, research]

options:
  review_enabled: false
  split_enabled: false
  parallel_enabled: false

tasks:
  - id: t1
    name: AionUi 产品速览
    agent: research
    task_type: research
    dependencies: []
    description: |
      【对象】https://github.com/iOfficeAI/AionUi
      【范围】仅 README/docs；禁止全仓扫描
      【格式】## 调研背景、## 信息来源、## 关键发现、## 结论
      【篇幅】每章 3–5 句
      【交卷】先写 deliverable 再 submit_result

  - id: t2
    name: 汇总
    agent: main
    task_type: strategy
    dependencies: [t1]
    description: |
      【输入】只读 t1 交付物
      【格式】## 背景、## 分析、## 方案、## 建议；须含「不确定性」
      【篇幅】300–500 字
      【交卷】先写 deliverable 再 submit_result
