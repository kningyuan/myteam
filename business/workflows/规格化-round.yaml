id: 规格化-round
name: 规格化（Spec）
version: "1.0"
description: |
  gstack 映射：/spec — 模糊意图 → 可执行规格与验收标准。
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: false
tasks:
  - id: task-1
    name: 规格化循环
    loop: spec_round
    dependencies: []
    description: |
      需求澄清 → PRD 级规格 → 决策记录。
loops:
  - id: spec_round
    max_rounds: 2
    min_rounds: 1
    default_body: default
    on_pass: complete
    on_exhaust: needs_review
    bodies:
      default:
        - id: step-clarify
          name: 意图澄清
          agent: main
          task_type: strategy
          dependencies: []
          description: |
            【gstack】/spec 阶段 1
            【范围】六问式澄清：谁、痛点、成功标准、非目标
            【交付】deliverables/spec-clarify.md
        - id: step-spec
          name: 可执行规格
          agent: product
          task_type: requirements
          dependencies:
            - step-clarify
          description: |
            【范围】用户故事、验收标准、依赖与风险
            【交付】deliverables/spec.md
        - id: step-signoff
          name: 规格确认记录
          agent: main
          task_type: decision-record
          dependencies:
            - step-spec
          description: |
            【交付】deliverables/spec-decision.md
