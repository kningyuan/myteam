# REG-L2：三角色并行评审 + strategy 汇总（L2 发版门禁 workflow）
id: reg-l2-3role
version: "1.0"
description: >
  L2 发版门禁用 workflow。3 个独立 research 叶子（模拟三角色并行评审）
  + 1 个 strategy 汇总依赖三者。配合 run_kernel --workflow reg-l2-3role 使用。

roster:
  required: [main, research]

options:
  review_enabled: false
  split_enabled: false
  parallel_enabled: true
  max_parallel: 3

tasks:
  - id: t1
    name: 产品视角评审
    agent: research
    task_type: research
    dependencies: []
    description: "从产品视角评审 myteam L2 并行调度能力，约200字。"

  - id: t2
    name: 架构视角评审
    agent: research
    task_type: research
    dependencies: []
    description: >
      从架构视角写 myteam L2 并行调度短评（约200字）。
      仅参考 docs/0608/01-架构演进分析.md 与 t1/t3 已有结论，禁止扫描 backend/ 源码树。

  - id: t3
    name: 测试视角评审
    agent: research
    task_type: research
    dependencies: []
    description: "从测试视角评审 myteam L2 回归与 KPI 度量，约200字。"

  - id: t4
    name: 三角色汇总
    agent: main
    task_type: strategy
    dependencies: [t1, t2, t3]
    description: "汇总 t1–t3 三角色评审结论，形成一份简短 L2 就绪评估报告。"
