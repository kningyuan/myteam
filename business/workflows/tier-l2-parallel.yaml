# Tier L2：三视角并行 research + strategy 汇总（description 仅变量，通用约束见 prompt_templates.yaml）
id: tier-l2-parallel
version: "1.1"
description: task_type 标准 prompt + 三并行 + strategy 汇总

roster:
  required: [main, product, research]

options:
  review_enabled: false
  split_enabled: false
  parallel_enabled: true
  max_parallel: 3

tasks:
  - id: t-product
    name: 产品设计调研
    agent: product
    task_type: research
    dependencies: []
    description: |
      【对象】https://github.com/iOfficeAI/AionUi
      【视角】产品：定位、目标用户、核心场景、与同类 Cowork/Agent UI 差异

  - id: t-arch
    name: 架构调研
    agent: research
    task_type: research
    dependencies: []
    description: |
      【对象】https://github.com/iOfficeAI/AionUi
      【视角】架构：技术栈、模块划分、与 CLI/Agent 集成、扩展点

  - id: t-eng
    name: 工程化调研
    agent: research
    task_type: research
    dependencies: []
    description: |
      【对象】https://github.com/iOfficeAI/AionUi
      【视角】工程化：构建方式、测试/CI、依赖、本地开发体验

  - id: t-summary
    name: 三视角综合报告
    agent: main
    task_type: strategy
    dependencies: [t-product, t-arch, t-eng]
    description: |
      【输入】只读 t-product、t-arch、t-eng 三份交付物
