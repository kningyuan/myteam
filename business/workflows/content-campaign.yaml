# PGD Profile: 内容/SEO/营销战役（无代码部署链）
id: content-campaign
version: "1.0"
description: >
  调研→需求/策略→内容生产→发布验收。裁剪 design/code 阶段，
  保留 PGD 核心：并行评审 + decision-record 闸门。

roster:
  required: [main, product, research, content]

options:
  review_enabled: false
  split_enabled: false

phases:
  - id: discover
    name: 调研与立项
  - id: strategy
    name: 策略对齐
  - id: produce
    name: 内容生产
  - id: acceptance
    name: 发布验收

tasks:
  - id: research-report
    phase: discover
    name: 调研报告
    agent: research
    task_type: research
    dependencies: []
    description: 围绕 goal 完成行业/竞品/受众调研。

  - id: review-research
    phase: discover
    name: 产品评调研
    agent: product
    task_type: architecture-review
    dependencies: [research-report]
    description: 评审调研是否支撑后续策略与内容决策。

  - id: discover-decision
    phase: discover
    name: 调研阶段决策
    agent: main
    task_type: decision-record
    dependencies: [review-research]
    description: 调研结论是否足以进入策略；开放 🔴 为 0。

  - id: strategy-draft
    phase: strategy
    name: 策略草案
    agent: product
    task_type: strategy
    dependencies: [discover-decision]
    description: 内容策略、关键词/主题集群、排期与成功指标。

  - id: review-strategy-research
    phase: strategy
    name: 研究员评策略
    agent: research
    task_type: architecture-review
    dependencies: [strategy-draft]
    description: 策略与调研证据是否一致；缺口与风险。

  - id: review-strategy-content
    phase: strategy
    name: 内容评策略
    agent: content
    task_type: architecture-review
    dependencies: [strategy-draft]
    description: 策略是否可执行（产能、格式、发布渠道）。

  - id: strategy-decision
    phase: strategy
    name: 策略阶段决策
    agent: main
    task_type: decision-record
    dependencies: [review-strategy-research, review-strategy-content]
    description: 策略仲裁；锁定内容生产输入。

  - id: strategy-final
    phase: strategy
    name: 策略定稿
    agent: product
    task_type: strategy
    dependencies: [strategy-decision]
    description: 策略定稿版，纳入 strategy-decision 采纳项。

  - id: content-batch
    phase: produce
    name: 内容交付
    agent: content
    task_type: content
    dependencies: [strategy-final]
    description: 按策略定稿产出正文内容（可单篇或系列，goal 中说明数量）。

  - id: review-content
    phase: produce
    name: 产品评内容
    agent: product
    task_type: architecture-review
    dependencies: [content-batch]
    description: 内容质量、关键词覆盖、品牌口径。

  - id: content-decision
    phase: produce
    name: 内容阶段决策
    agent: main
    task_type: decision-record
    dependencies: [review-content]
    description: 内容是否可发布；开放 🔴 为 0。

  - id: publish
    phase: acceptance
    name: 发布动作
    agent: content
    task_type: publish-post
    dependencies: [content-decision]
    description: 在目标平台发布并附 URL/截图证据。

  - id: acceptance
    phase: acceptance
    name: 战役验收
    agent: product
    task_type: acceptance-report
    dependencies: [publish]
    description: 对照策略成功指标验收；发布建议。
