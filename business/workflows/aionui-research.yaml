# 最简团队协作调研：三视角并行 research + main 汇总
id: aionui-research
version: "1.0"
description: >
  对指定开源项目做产品 / 架构 / 工程化三视角调研，最后由 main 汇总。
  跳过 live team_config / task_plan，DAG 固定，适合验证「能协作跑通」。

roster:
  required: [main, product, research]

options:
  review_enabled: false
  split_enabled: false
  parallel_enabled: true
  max_parallel: 3

tasks:
  - id: t-product
    name: 产品设计调研
    agent: product
    task_type: research
    dependencies: []
    description: |
      调研目标：https://github.com/iOfficeAI/AionUi
      视角：产品设计（定位、目标用户、核心场景、功能模块、与同类 Cowork/Agent UI 的差异）。
      请访问上述 GitHub 仓库 README、文档与 Releases，基于公开信息撰写 research 交付物。
      禁止编造未在来源中出现的功能；信息不足处写入「风险评估」。

  - id: t-arch
    name: 架构调研
    agent: research
    task_type: research
    dependencies: []
    description: |
      调研目标：https://github.com/iOfficeAI/AionUi
      视角：系统架构（技术栈、模块划分、与 CLI/Agent 的集成方式、扩展点、部署形态）。
      请阅读仓库目录结构、package/构建配置、架构相关文档；输出 research 交付物。
      禁止未读代码就猜测实现细节。

  - id: t-eng
    name: 工程化调研
    agent: research
    task_type: research
    dependencies: []
    description: |
      调研目标：https://github.com/iOfficeAI/AionUi
      视角：工程化实现（仓库组织、构建/测试/CI、依赖管理、本地开发体验、可维护性观察）。
      请基于仓库公开文件撰写 research 交付物；不确定处标注在「风险评估」。

  - id: t-summary
    name: 三视角汇总
    agent: main
    task_type: strategy
    dependencies: [t-product, t-arch, t-eng]
    description: |
      阅读并汇总 t-product、t-arch、t-eng 三份调研交付物，
      形成一份 AionUi 综合调研报告（产品 / 架构 / 工程化对照 + 总体结论与可借鉴点）。
