id: 质量验收-round
name: QA 验收（测修循环）
version: "1.0"
description: |
  gstack 映射：/qa — 测试 → 修复 → 再验。浏览器证据由 qa Agent 挂载 browse skill 完成。
options:
  review_enabled: false
  split_enabled: false
  collaboration:
    project_group:
      enabled: true
    notifications:
      enabled: true
    group_discussion:
      enabled: false
tasks:
  - id: task-1
    name: QA 循环
    loop: qa_cycle_round
    dependencies: []
    description: |
      每轮：qa 测试与报告 → developer 修复 → qa 回归判定。
loops:
  - id: qa_cycle_round
    max_rounds: 5
    min_rounds: 1
    default_body: default
    on_pass: complete
    on_exhaust: needs_review
    bodies:
      default:
        - id: step-test
          name: 测试与缺陷报告
          agent: qa
          task_type: code-testing
          dependencies: []
          description: |
            【gstack】/qa 或 /qa-only
            【Skill】qa-methodology；需浏览器时调用 browse skill
            【范围】按 Goal 指定 URL/分支；截图与 repro 写入交付物
            【交付】deliverables/qa-report.md
            【质量】health 评分；末行 QA: PASS 或 QA: FAIL
        - id: step-fix
          name: 缺陷修复
          agent: developer
          task_type: code-writing
          dependencies:
            - step-test
          description: |
            【范围】仅修复 step-test 列出的缺陷；每项修复对应 commit 说明
            【交付】代码变更 + deliverables/qa-fix-log.md
            【条件】step-test 为 QA: PASS 时可输出「无需修复」并跳过实质改动
        - id: step-retest
          name: 回归确认
          agent: qa
          task_type: code-testing
          dependencies:
            - step-fix
          description: |
            【范围】验证 step-fix；对比前后 health
            【交付】deliverables/qa-retest.md
            【质量】末行 QA: PASS 或 QA: FAIL
    assess:
      ref: step-retest
      inputs:
        - kind: goal
        - kind: phase.deliverable
          phase: step-fix
    transition:
      - when: deliverable_marker
        task: step-retest
        marker: "QA: PASS"
        action: exit
        outcome: complete
      - when: deliverable_marker
        task: step-retest
        marker: "QA: FAIL"
        action: continue
        next_body: default
      - when: exhausted
        action: exit
        outcome: needs_review
